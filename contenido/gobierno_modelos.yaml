      alimenta: [nota_calidad_datos]
      secciones: [Implementación]
    - nombre: "Artefacto Ambientes Productivos"
      owner: "CoE MRM · Unit Tecnología de Riesgo de Modelo"
      recurrencia: Trimestral
      corte: "-"
      sistema: "Archivo compartido"
      alimenta: [impl_np_despliegue, impl_np_data]
      secciones: [Implementación]
    - nombre: "Nota de Gobierno"
      owner: "CoE MRM · Hub de Control y Modelos Financieros"
      recurrencia: Trimestral
      corte: "-"
      sistema: "Proceso interno"
      alimenta: [nota_documentacion]
      secciones: [Gobierno]
  pasos:
    - t: "Recolección de las fuentes"
      quien: "Owners de cada fuente → Equipo de Control MRM"
      cadencia: "Mensual"
      nota: "Cada owner entrega su información según su recurrencia y fecha de corte. El equipo de Control MRM la recolecta."
      entra: "Las fuentes de información de cada owner"
      sale: "Fuentes del mes listas para procesar"
    - t: "Consolidación del input principal"
      quien: "Equipo de Control MRM"
      cadencia: "Mensual"
      nota: "Se juntan y procesan todas las fuentes, se revisa su calidad y se relacionan por el ID del modelo."
      entra: "Fuentes del mes"
      sale: "Input principal histórico: una fila por modelo y mes"
    - t: "Cálculo de indicadores y actualización del reporte"
      quien: "Equipo de Control MRM"
      cadencia: "Mensual"
      nota: "Cada indicador recibe una puntuación de 0 a 100; con ellas se calcula el score por driver y el score MRM, y se genera el reporte."
      entra: "Input principal histórico"
      sale: "Reporte Score MRM actualizado"
    - t: "Revisión de resultados"
      quien: "Equipo de Control MRM"
      cadencia: "Mensual"
      nota: "El equipo de Control revisa los resultados antes de compartirlos."
      entra: "Reporte Score MRM actualizado"
      sale: "Resultados revisados"
    - t: "Pre-publicación a los PO usuarios"
      tipo: decision
      quien: "PO usuarios de los modelos"
      cadencia: "Mensual"
      nota: "Los PO usuarios revisan los resultados de sus modelos. Si hay puntos por corregir o descargos, el equipo de Control los atiende y corrige el reporte."
      entra: "Resultados revisados"
      sale: "Reporte corregido con los descargos atendidos"
    - t: "Envío del reporte final"
      quien: "Equipo de Control MRM"
      cadencia: "Mensual"
      nota: "Se envía a los PO usuarios y a los gerentes de los equipos usuarios, modeladores, validadores y otras áreas involucradas."
      entra: "Reporte corregido"
      sale: "Reporte final distribuido"
    - t: "Presentación al Comité de Modelos"
      quien: "Equipo de Control MRM → Comité de Modelos"
      cadencia: "Trimestral"
      nota: "Se presenta el score MRM de los modelos Tier I y los temas relevantes del score."
      entra: "Reporte final del trimestre"
      sale: "Temas elevados al Comité de Modelos"
