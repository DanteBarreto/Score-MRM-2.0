  responsable: "Equipo de Control MRM · Hub de Control y Modelos Financieros"
  fuentes:
    - nombre: "Inventario de modelos"
      owner: "Equipo de Seguimiento / Modeladores / Owner del modelo"
      recurrencia: Mensual
      corte: "1ra semana de cada mes"
      sistema: "Software MRM"
      alimenta: [incidencias_inventario]
      secciones: [Inventario, Gobierno]
    - nombre: "Metadata y TTM"
      owner: "Equipo de Seguimiento / Modeladores"
      recurrencia: Mensual
      corte: "1ra semana de cada mes"
      sistema: "Metadata"
      alimenta: [sin_seguimiento, alerta_salud, alerta_excede_tiempo, alerta_sin_mitigantes, profundidad_seguimiento]
      secciones: [Seguimiento]
