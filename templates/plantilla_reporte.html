<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Score MRM</title>
<!-- Plantilla base: Tabler 1.4 (MIT) sobre Bootstrap 5 · Íconos: Tabler Icons (MIT) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
:root{
  /* Semáforo (alineado a la paleta de Tabler) + "No aplica" */
  --g:#2fb344; --g-bg:#e6f6e9; --a:#e08900; --a-bg:#fff3dc; --r:#d63939; --r-bg:#fbe6e6; --n:#b5bcc6; --n-bg:#f1f3f6;
  --track:#eef1f5; --drv-bg:#eef4fa;
}
body{background:#f6f8fb}
/* Barra lateral */
.marca{font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.navbar-vertical{background:linear-gradient(180deg,#096AAD 0%,#FF6600 100%)!important;border-right:0;color:#fff}
.navbar-vertical .navbar-brand,.navbar-vertical .nav-link,.navbar-vertical .nav-link-icon,.navbar-vertical .navbar-toggler{color:#fff!important}
.side-label{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;font-weight:600;padding:.75rem .75rem .35rem;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.filtros{padding:0 .75rem 1rem}
.filtros .form-label{font-size:.75rem;color:#fff;font-weight:600;margin:.5rem 0 .2rem;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.filtros .on{border-color:#fff;box-shadow:0 0 0 .15rem rgba(255,255,255,.55)}
#fcount{color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.navbar-vertical .nav-link:hover{background:rgba(255,255,255,.12);border-radius:6px}
.navbar-vertical .nav-item.active .nav-link{background:rgba(255,255,255,.24);border-radius:6px;font-weight:600}
.navbar-vertical .navbar-nav{padding:0 .5rem}

/* KPIs y tarjetas */
.kpi .avatar{width:2.75rem;height:2.75rem;font-size:1.35rem}
.kpi .h1{font-variant-numeric:tabular-nums}
/* Gráficos */
.lineas svg{display:block;width:100%;height:auto}
.lineas text{font-family:inherit;fill:var(--tblr-secondary);font-size:12px}
.lineas text.valor{fill:var(--tblr-body-color);font-size:14px;font-weight:700}
.lineas text.sel{fill:var(--tblr-body-color);font-weight:700}
.lineas .hit{fill:transparent;outline:none}
.lineas .cruz{stroke:var(--tblr-secondary);stroke-width:1;opacity:0}
.lineas .col:hover .cruz,.lineas .col:focus-within .cruz{opacity:.5}
#tip{position:fixed;transform:translate(-50%,-100%);background:#fff;border:1px solid var(--tblr-border-color);border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:.4rem .6rem;font-size:.78rem;white-space:pre-line;pointer-events:none;z-index:2000}
#tip::first-line{font-weight:700}
.leg{display:flex;gap:12px;font-size:.75rem;color:var(--tblr-secondary);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.barras{display:flex;flex-direction:column;gap:.55rem}
.barra{display:grid;grid-template-columns:minmax(90px,38%) 1fr 3.2rem;gap:.6rem;align-items:center;font-size:.82rem}
.barra .et{line-height:1.15}
.barra b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.pista{display:flex;gap:2px;height:12px}
.pista i{display:block;height:100%;min-width:3px}
.pista i:last-child{border-radius:0 4px 4px 0}
.grupo-fila{cursor:pointer}
.grupo-fila button{all:unset;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.grupo-fila button:focus-visible{outline:2px solid var(--tblr-primary);outline-offset:2px}
.heat tr.sub td:first-child{padding-left:2.1rem;color:var(--tblr-secondary)}

/* Semáforo */
.sem{display:inline-flex;align-items:center;gap:6px;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap}
.sem::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.verde{color:var(--g);background:var(--g-bg)}.ambar{color:var(--a);background:var(--a-bg)}.rojo{color:var(--r);background:var(--r-bg)}.na{color:#8a93a0;background:var(--n-bg)}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}

/* Tablero vertical de indicadores */
.tablero{margin:0}
.tablero thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tblr-secondary);background:#fff;border-bottom:2px solid var(--tblr-border-color)}
.tablero td{vertical-align:middle;padding-top:.6rem;padding-bottom:.6rem}
.tablero td:not(.drv){padding-left:1rem!important}
.tablero td.drv{padding-left:1.25rem!important}
.tablero tr.grupo td{border-top:2px solid var(--tblr-border-color)}
.tablero td.drv{background:var(--drv-bg);width:190px;border-right:1px solid var(--tblr-border-color)}
.tablero td.drv .nombre{font-weight:700;display:flex;align-items:center;gap:6px}
.tablero td.drv .nombre i{color:var(--tblr-primary)}
.tablero td.val{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;width:90px}
.tablero td.luz{text-align:center;width:90px}
.tablero td.pts{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;width:110px}
.tablero tr.no-aplica td:not(.drv){color:#9aa3af}
.score-actual{display:flex;align-items:center;gap:12px}
.score-actual .num{font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.leyenda-umbral{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:14px;border-top:1px solid var(--tblr-border-color);font-size:.85rem}
.leyenda-umbral div{display:flex;align-items:center;gap:8px}

/* Tabla mapa de calor */
.heat thead th{cursor:pointer;user-select:none;white-space:nowrap;vertical-align:middle}
.heat td{white-space:nowrap}
td.cell{font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.macro-scroll{max-height:70vh;overflow:auto}
.macro-scroll thead{position:sticky;top:0;z-index:3}
.macro-scroll thead th{background:#fff}
.macro-scroll thead tr.banda th{cursor:default;border-left:1px solid var(--tblr-border-color);color:var(--tblr-secondary)}
.macro-scroll .fija{position:sticky;left:0;background:#fff;z-index:1;white-space:normal;min-width:240px;max-width:280px}
.macro-scroll thead .fija{z-index:4}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--tblr-primary-lt);color:var(--tblr-primary);border-radius:999px;padding:.15rem .3rem .15rem .7rem;font-size:.78rem;margin:0 .35rem .35rem 0}
.chip button{border:0;background:none;color:inherit;padding:0 .3rem;font-size:1rem;line-height:1}
.view{display:none}.view.active{display:block}
.empty{padding:40px;text-align:center;color:var(--tblr-secondary)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obs-fila{cursor:pointer}
.obs-det td{background:var(--drv-bg);white-space:normal}
/* Flujo de inputs */
.flujo{display:grid;grid-template-columns:minmax(0,1.5fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.5fr);gap:.75rem;align-items:stretch}
.flujo-paso{display:flex;flex-direction:column;gap:.6rem}
.flujo-num{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tblr-secondary)}
.flujo-caja{border:1px solid var(--tblr-border-color);border-radius:8px;padding:.7rem .8rem;background:#fff;font-size:.82rem;line-height:1.35}
.flujo-caja b{display:block;margin-bottom:.15rem;font-size:.86rem}
.flujo-caja.ancha{flex:1;display:flex;flex-direction:column;justify-content:center}
.flujo-caja.input{border-left:4px solid var(--input)}
.flujo-flecha{display:flex;align-items:center;color:var(--tblr-secondary);font-size:1.4rem}
.flujo-seccion{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.flujo-origen{display:inline-flex;gap:4px;align-items:center;color:var(--tblr-secondary);font-size:.74rem}
.flujo-origen i{width:9px;height:9px;border-radius:50%;background:var(--input)}
@media (max-width:991px){.flujo{grid-template-columns:minmax(0,1fr)}.flujo-flecha{justify-content:center;transform:rotate(90deg)}}
/* Detalle de alertas */
.alertas-tabla td{vertical-align:middle}
.alertas-tabla .desc{white-space:normal;min-width:280px;max-width:420px}
.stat .h2{font-variant-numeric:tabular-nums}
@media (max-width:640px){.tablero td.drv{width:auto}.tablero td.val,.tablero td.luz,.tablero td.pts{width:auto}}
@media print{.navbar-vertical,.page-header .btn-list,.toolbar,#chips{display:none!important}.page-wrapper{margin-left:0!important}.view{display:block!important;page-break-after:always}}
</style>
</head>
<body>
<div class="page">

  <!-- Barra lateral -->
  <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="light">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-controls="sidebar-menu" aria-expanded="false" aria-label="Mostrar menú"><span class="navbar-toggler-icon"></span></button>
      <div class="navbar-brand d-flex align-items-center gap-2">
        <span class="marca">Score MRM</span>
      </div>
      <div class="collapse navbar-collapse" id="sidebar-menu">
        <div class="w-100">
          <div class="side-label">Secciones</div>
          <ul class="navbar-nav" id="tabs">
            <li class="nav-item active"><a class="nav-link" href="#" data-v="resumen"><span class="nav-link-icon"><i class="ti ti-chart-pie"></i></span><span class="nav-link-title">Reporte</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-v="macro"><span class="nav-link-icon"><i class="ti ti-table"></i></span><span class="nav-link-title">Macro</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-v="seguimiento"><span class="nav-link-icon"><i class="ti ti-activity-heartbeat"></i></span><span class="nav-link-title">Seguimiento</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-v="validacion"><span class="nav-link-icon"><i class="ti ti-shield-check"></i></span><span class="nav-link-title">Validación</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#" data-v="obs"><span class="nav-link-icon"><i class="ti ti-clipboard-text"></i></span><span class="nav-link-title">Observaciones</span></a></li>

  <!-- Contenido -->
  <div class="page-wrapper">

      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="col">
            <div class="page-pretitle">COE Model Risk Management</div>
            <h2 class="page-title">Reporte de indicadores de modelos</h2>

              <button class="btn btn-outline-secondary" id="exportar"><i class="ti ti-file-export me-1"></i>Exportar CSV</button>
              <button class="btn btn-primary" onclick="window.print()"><i class="ti ti-printer me-1"></i>Imprimir / PDF</button>

        <div class="view" id="v-validacion"></div>
        <div class="view" id="v-obs"></div>

      </div>

    <footer class="footer footer-transparent d-print-none">

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
<script>
/* ===================== DATOS ===================== */
// generar_reporte.py reemplaza esta marca con el contenido del Excel.
const DATOS = /*__DATOS__*/null;

/* ===================== UTILIDADES DE CÁLCULO ===================== */
const UMBRALES = { rojo: 70, verde: 80 };
const clamp = v => Math.max(0, Math.min(100, v));
const sem = s => (s == null ? 'na' : s < UMBRALES.rojo ? 'rojo' : s > UMBRALES.verde ? 'verde' : 'ambar');
const SEM_TXT = { verde: 'Verde', ambar: 'Ámbar', rojo: 'Rojo', na: 'No aplica' };
const COLOR = { verde: 'g', ambar: 'a', rojo: 'r', na: 'n' };
const fmt = v => (v == null ? '–' : (Math.round(v * 10) / 10).toLocaleString('es-PE', { maximumFractionDigits: 1 }));
const fmt0 = v => (v == null ? '–' : Math.round(v).toLocaleString('es-PE'));
const esSimulada = f => DATOS.fechas_simuladas.includes(f);
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const mesTxt = f => `${MESES[+f.slice(5, 7) - 1]}-${f.slice(2, 4)}`;
const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const avgN = a => { const v = a.filter(x => x != null); return v.length ? avg(v) : null; };
const sum = (ms, k) => ms.reduce((a, m) => a + (+m[k] || 0), 0);
const cuenta = (ms, f) => ms.filter(f).length;
const es = (k, ...vals) => m => vals.includes(m[k]);
const prom = (ms, k) => avgN(ms.map(m => m[k]));
const ratio = (n, d) => (d ? clamp(100 * (1 - n / d)) : null);   // 1 - n/d en escala 0-100
const NA = { v: null, p: null };                                 // valor "-" y puntuación "No aplica"

/* ===================== MEDIDAS ===================== */
// Cada medida recibe un conjunto de modelos y devuelve { v: valor, p: puntuación }.
// Se evalúa igual sobre el portafolio filtrado o sobre un solo modelo.
const notaProm = k => ms => { const a = prom(ms, k); return a == null ? NA : { v: a * 100, p: a * 100 }; };
const medAlerta = ms => {
  if (!cuenta(ms, es('ESTADO_ALERTA', 'En alerta', 'Sin alerta'))) return NA;
  const v = cuenta(ms, es('ESTADO_ALERTA', 'En alerta'));
  return { v, p: ratio(v, ms.length) };
};
const medAmbiente = (amb, rat) => ms => {
  if (!cuenta(ms, es(amb, 'PRODUCTIVO', 'NO PRODUCTIVO', 'MIXTO'))) return NA;
  const r = prom(ms, rat);
  return { v: cuenta(ms, es(amb, 'NO PRODUCTIVO', 'MIXTO')), p: r == null ? null : r * 100 };
};
const medObs = (venc, pend) => ms => ({ v: sum(ms, venc), p: ratio(sum(ms, venc), sum(ms, pend)) });

// lp: cómo se puntúa el indicador, explicado para el usuario en la sección Gobierno
const CFG = {
  drivers: [
    { key: 'seguimiento', nombre: 'Seguimiento', icono: 'ti-activity', peso: 1, ind: [
      { key: 'sin_seguimiento', nombre: '# Modelos sin seguimiento', tipo: 'conteo',
        lp: 'Porcentaje de modelos que no figuran sin seguimiento.',
        med: ms => {
          if (!cuenta(ms, es('ESTADO_SEGUIMIENTO', 'Con Seguimiento', 'Sin Seguimiento'))) return NA;
          const v = cuenta(ms, es('ESTADO_SEGUIMIENTO', 'Sin Seguimiento'));
          return { v, p: ratio(v, ms.length) };
        } },
      { key: 'alerta_salud', nombre: '# Modelos con alerta de salud', tipo: 'conteo',
        lp: 'Porcentaje de modelos que no están en alerta.', med: medAlerta },
      { key: 'alerta_excede_tiempo', nombre: '# Modelos con alerta de salud que exceden el tiempo máximo de atención', tipo: 'conteo',
        lp: 'De los modelos en alerta, porcentaje que no excede el tiempo máximo de atención. No aplica si no hay modelos en alerta.',
        med: ms => {
          const a = medAlerta(ms);
          if (a.p == null || a.v === 0 || !cuenta(ms, es('EXCEDE_TTM', 'Excede TTM', 'No excede'))) return NA;
          const v = cuenta(ms, es('EXCEDE_TTM', 'Excede TTM'));
          return { v, p: ratio(v, a.v) };
        } },
      { key: 'alerta_sin_mitigantes', nombre: '# Modelos con alerta de salud sin mitigante temporal', tipo: 'conteo',
        lp: 'De los modelos en alerta, porcentaje que no figura sin mitigante temporal. No aplica si no hay modelos en alerta.',
        med: ms => {
          const a = medAlerta(ms);
          if (a.p == null || a.v === 0) return NA;
          const v = cuenta(ms, m => m.ESTADO_ALERTA === 'En alerta' && m.PRESENCIA_MITIGANTE === 'No');
          return { v, p: ratio(v, a.v) };
        } },
      { key: 'profundidad_seguimiento', nombre: 'Nivel de profundidad de seguimiento (%)', tipo: 'nota',
        lp: 'Promedio de las notas de base de datos, gobierno, precisión y discriminación, granularidad y análisis univariado.', med: notaProm('_PROFUNDIDAD') } ] },
    { key: 'validacion', nombre: 'Validación', icono: 'ti-checks', peso: 1, ind: [
      { key: 'sin_val_inicial', nombre: '# Modelos sin validación de primera vez', tipo: 'conteo',
        lp: 'Porcentaje de modelos que tienen validación de primera vez.',
        med: ms => { const v = cuenta(ms, es('VALIDACION_COMPLETA', 'Sin validación')); return { v, p: ratio(v, ms.length) }; } },
      { key: 'incumple_val_periodica', nombre: '# Modelos que incumplen la validación periódica', tipo: 'conteo',
        lp: 'Porcentaje de modelos con la validación periódica vigente.',
        med: ms => { const v = cuenta(ms, es('VALIDACION_PERIODICA', 'Descoberturado')); return { v, p: ratio(v, ms.length) }; } },
      { key: 'nota_dinamica_validacion', nombre: 'Nota dinámica de validación (%)', tipo: 'nota',
        lp: 'Promedio de la nota dinámica de validación.', med: notaProm('NOTA_DINAMICA_VALIDACION') } ] },
    { key: 'observaciones', nombre: 'Observaciones', icono: 'ti-clipboard-list', peso: 1, ind: [
      { key: 'obs_venc_validacion', nombre: '# Observaciones vencidas de validación (críticas, relevantes y moderadas)', tipo: 'conteo',
        lp: 'De las observaciones pendientes críticas, relevantes y moderadas, porcentaje que aún no está vencido. No aplica si no hay pendientes.',
        med: medObs('OBS_CRIT_RELE_MODE_VENCIDAS_VI', 'OBS_CRIT_RELE_MODE_PENDIENTES_VI') },
      { key: 'obs_venc_reg_aud', nombre: '# Observaciones vencidas del regulador local, auditoría externa y auditoría interna', tipo: 'conteo',
        lp: 'De las observaciones pendientes del regulador y auditoría, porcentaje que aún no está vencido. No aplica si no hay pendientes.',
        med: medObs('OBS_SBS_AI_VENCIDAS', 'OBS_SBS_AI_PENDIENTES') } ] },
    { key: 'implementacion', nombre: 'Implementación', icono: 'ti-server-2', peso: 1, ind: [
      { key: 'impl_np_despliegue', nombre: '# Modelos implementados en ambientes no productivos en el despliegue', tipo: 'conteo',
        lp: 'Promedio del nivel productivo del despliegue: productivo vale 100, mixto 50 y no productivo 0.', med: medAmbiente('AMBIENTE_DESPLIEGUE', 'RATIO_IMPLEMENTACION') },
      { key: 'impl_np_data', nombre: '# Modelos implementados en ambientes no productivos en la data', tipo: 'conteo',
        lp: 'Promedio del nivel productivo de la data: productivo vale 100, no productivo 0 y mixto según la parte que esté en producción.', med: medAmbiente('AMBIENTE_DATA', 'RATIO_DATA') },
      { key: 'nota_calidad_datos', nombre: 'Nota de cumplimiento de la calidad de datos (%)', tipo: 'nota',
        lp: 'Promedio de la nota de calidad de datos.', med: notaProm('NOTA_CALIDAD_DATOS') } ] },
    { key: 'gobierno', nombre: 'Gobierno', icono: 'ti-scale', peso: 1, ind: [
      { key: 'incidencias_inventario', nombre: '# Incidentes en el inventario de modelos', tipo: 'conteo',
        lp: 'Compara los incidentes con el total de modelos: sin incidentes puntúa 100 y baja a medida que aumentan.',
        med: ms => { const v = sum(ms, 'NUM_INCIDENTES'); return { v, p: ratio(v, ms.length) }; } },
      { key: 'nota_documentacion', nombre: 'Nota de documentación (desarrollo, validación, estándares, políticas, waivers y uso de la calculadora de valorización) (%)', tipo: 'nota',
        lp: 'Promedio de la nota de documentación.', med: notaProm('NOTA_GOBIERNO') } ] },
    { key: 'desarrollo', nombre: 'Desarrollo', icono: 'ti-code', peso: 1, ind: [
      { key: 'nota_lineamientos_desarrollo', nombre: 'Nota de 10 lineamientos de desarrollo (Transformación de Riesgos) (%)', tipo: 'nota',
        lp: 'Promedio de la nota de cumplimiento de los 10 lineamientos.', med: notaProm('NOTA_10_LINEAMIENTOS') } ] }
  ]
};
const IND = CFG.drivers.flatMap(d => d.ind);
// Dimensiones del inventario usadas como filtros
const DIMS = [
  { k: 'TIER_MODELO', t: 'Tier' },
  { k: 'BANCA', t: 'Banca' },
  { k: 'PRODUCTO', t: 'Producto' },
  { k: 'MODEL_DEVELOPER', t: 'Model developer' },
  { k: 'MODEL_USER', t: 'Model user' },
  { k: 'PO_USUARIO', t: 'PO / Usuario responsable' },
  { k: 'PROCESO', t: 'Proceso' }

/* ===================== CÁLCULO ===================== */
function medidas(ms) {
  const ind = {}, drv = {};
  CFG.drivers.forEach(d => { drv[d.key] = avgN(d.ind.map(i => (ind[i.key] = i.med(ms)).p)); });
  const ds = CFG.drivers.filter(d => drv[d.key] != null);
  const peso = ds.reduce((a, d) => a + d.peso, 0);
  return { ind, drv, global: peso ? ds.reduce((a, d) => a + d.peso * drv[d.key], 0) / peso : null };
}
function preparar(filas) {
  return filas.map(f => {
    const m = { ...f, ID_MODELO: String(f.ID_MODELO), _PROFUNDIDAD: avgN(['BBDD', 'GOB', 'PRECISION_DISCRIMINACION', 'GRANULARIDAD', 'UNIVARIADA'].map(k => f[k])) };
    const r = medidas([m]);
    m.ps = r.drv; m.global = r.global; m.pi = {}; m.vi = {};
    IND.forEach(i => { m.pi[i.key] = r.ind[i.key].p; m.vi[i.key] = r.ind[i.key].v; });
    return m;
  });
}
const fmtVal = (i, r) => (r.v == null ? '–' : fmt0(r.v) + (i.tipo === 'nota' ? '%' : ''));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uniq = k => [...new Set(MODELOS.map(m => m[k]).filter(v => v !== '' && v != null))].sort((a, b) => String(a).localeCompare(String(b), 'es'));

const col = s => COLOR[sem(s)];
const pill = s => `<span class="sem ${sem(s)}">${SEM_TXT[sem(s)]}</span>`;
const dot = s => `<span class="dot" style="background:var(--${col(s)})" title="${SEM_TXT[sem(s)]}"></span>`;
const cellStyle = s => `background:var(--${col(s)}-bg);color:${s == null ? '#8a93a0' : `var(--${col(s)})`}`;
const leyendaUmbral = () => `<div class="leyenda-umbral">

function marcarFiltros() {

const pasaFiltros = m => {
  const q = FIL.q.toLowerCase();
  return (!q || [m.ID_MODELO, m.NOMBRE_MODELO].join(' ').toLowerCase().includes(q)) &&
    (!FIL.modelo || m.ID_MODELO === FIL.modelo) &&

/* ===================== VISTAS ===================== */
// Score por FECHA: respeta todos los filtros salvo la propia fecha
function serieEvolutivo() {
  return DATOS.fechas.map(f => {
    const ms = TODOS.filter(m => m.FECHA === f && pasaFiltros(m));
    return { f, n: ms.length, s: ms.length ? medidas(ms).global : null, sim: esSimulada(f) };
  }).filter(p => p.s != null);
}
// Gráfico de líneas por fecha. series: [{ nombre, color, vals }]; op: { ymax, bandas, marcasY, valores, finales, tip }
function lineas(fechas, series, op) {
  const W = 900, H = 200, M = { t: 24, r: op.finales ? 170 : 30, b: 28, l: 34 };
  const y = v => M.t + (op.ymax - v) / op.ymax * (H - M.t - M.b);
  const x = i => (fechas.length < 2 ? (M.l + W - M.r) / 2 : M.l + 50 + i * (W - M.l - M.r - 100) / (fechas.length - 1));
  const banda = ([de, a, c]) => `<rect x="${M.l}" y="${y(a)}" width="${W - M.l - M.r}" height="${y(de) - y(a)}" fill="var(--${c}-bg)"/>`;
  const marcaY = v => `${op.bandas ? '' : `<line x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--tblr-border-color)"/>`}<text x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const tramos = s => s.vals.slice(1).map((v, i) => `<line x1="${x(i)}" y1="${y(s.vals[i])}" x2="${x(i + 1)}" y2="${y(v)}" stroke="${s.color}" stroke-width="2" ${esSimulada(fechas[i]) || esSimulada(fechas[i + 1]) ? 'stroke-dasharray="6 5"' : ''}/>`).join('');
  const puntos = s => s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${esSimulada(fechas[i]) ? '#fff' : s.color}" stroke="${esSimulada(fechas[i]) ? s.color : '#fff'}" stroke-width="2"/>
    ${op.valores ? `<text class="valor" x="${x(i)}" y="${y(v) - 12}" text-anchor="middle">${fmt(v)}</text>` : ''}`).join('');
  // Etiquetas al final de cada línea, separadas para que no se pisen
  let previo = -99;
  const finales = !op.finales ? '' : series.map(s => ({ s, v: s.vals[s.vals.length - 1] })).sort((a, b) => b.v - a.v).map(({ s, v }) => {
    previo = Math.max(y(v) + 4, previo + 14);
    return `<text x="${x(fechas.length - 1) + 12}" y="${previo}">${esc(s.nombre)}: ${v}</text>`;
  }).join('');
  const ancho = fechas.length < 2 ? W - M.l - M.r : (W - M.l - M.r - 100) / (fechas.length - 1);
  const columnas = fechas.map((f, i) => `<text class="${f === FIL.fecha ? 'sel' : ''}" x="${x(i)}" y="${H - 8}" text-anchor="middle">${mesTxt(f)}</text>
    <g class="col"><line class="cruz" x1="${x(i)}" x2="${x(i)}" y1="${M.t}" y2="${H - M.b}"/><rect class="hit" x="${x(i) - ancho / 2}" y="${M.t}" width="${ancho}" height="${H - M.t - M.b}" tabindex="0" data-tip="${esc(op.tip(i))}" aria-label="${esc(op.tip(i))}"/></g>`).join('');
  return `<div class="lineas"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.titulo)}">
    ${(op.bandas || []).map(banda).join('')}${op.marcasY.map(marcaY).join('')}${series.map(tramos).join('')}${series.map(puntos).join('')}${finales}${columnas}</svg></div>`;
}
function evolutivo() {
  const pts = serieEvolutivo(), fechas = pts.map(p => p.f);
  const ult = pts[pts.length - 1], ant = pts[pts.length - 2];
  const delta = ant ? ult.s - ant.s : null;
  const extra = delta == null ? '' : `<span class="text-secondary small">${delta >= 0 ? '▲' : '▼'} ${fmt(Math.abs(delta))} pts vs ${mesTxt(ant.f)}</span>`;
  const nota = pts.some(p => p.sim) ? ' · línea punteada y punto hueco: dato simulado' : '';
  const tip = i => {
    const p = pts[i], a = pts[i - 1];
    return `${mesTxt(p.f)}\nScore: ${fmt(p.s)} · ${SEM_TXT[sem(p.s)]}\n${p.n} modelos${a ? `\nVariación: ${p.s >= a.s ? '+' : '−'}${fmt(Math.abs(p.s - a.s))} pts` : ''}`;
  };
  const grafico = lineas(fechas, [{ nombre: 'Score', color: 'var(--tblr-primary)', vals: pts.map(p => p.s) }], {
    ymax: 100, valores: true, marcasY: [0, UMBRALES.rojo, UMBRALES.verde, 100], titulo: 'Evolutivo del score por fecha', tip,
    bandas: [[0, UMBRALES.rojo, 'r'], [UMBRALES.rojo, UMBRALES.verde, 'a'], [UMBRALES.verde, 100, 'g']]
  });
  return `<div class="card mb-3"><div class="card-header"><div><h3 class="card-title d-flex align-items-center gap-2"><i class="ti ti-chart-line text-primary"></i>Evolutivo del score</h3>
      <div class="text-secondary small mt-1">Score por fecha con los filtros aplicados${nota}</div></div><div class="card-actions">${extra}</div></div>
    <div class="card-body py-2">${grafico}</div></div>`;
}

    }).join('')}
  </tbody></table></div>`;
}
const bandaDrivers = () => CFG.drivers.map(d => `<th class="text-center" colspan="${d.ind.length}">${d.nombre}</th>`).join('');
function tablaIndicadores(ms) {
  const dato = (m, k) => (modoInd === 'valor' ? m.vi[k] : m.pi[k]);
  const val = (m, k) => (k === 'global' ? m.global : k === 'alerta_excede_tiempo' ? m.EXCESO_MESES_TTM ?? -999 : k in CATEGORIA ? m[CATEGORIA[k]] ?? '' : k in m.pi ? dato(m, k) : k === 'ID_MODELO' ? +m[k] : m[k]);
  const th = (k, t, titulo, cls = 'text-center') => `<th class="${cls}" data-t="m" data-k="${k}" title="${esc(titulo || t)}" style="white-space:normal">${esc(t)}${flecha(ordenM, k)}</th>`;
  const fuente = s => `color:${s == null ? '#8a93a0' : `var(--${col(s)})`}`;

/* ===================== OBSERVACIONES ===================== */
const OBS = DATOS.observaciones.map(o => ({ ...o, id_modelo: String(o.id_modelo), compromiso: o.fecha_ampliada || o.fecha_estimada }));
const OBS_CRIT = ['Crítico', 'Relevante', 'Moderado', 'Bajo', 'Potencial', 'Nulo'];

const OBS_PLAZO = [{ n: 'Vencidas', c: 'var(--r)' }, { n: 'Vencen en 30 días o menos', c: 'var(--a)' }, { n: 'Vencen en más de 30 días', c: 'var(--g)' }];

const obsVencida = o => o.vencimiento === 'Vencido';
const obsPlazo = o => (obsVencida(o) ? OBS_PLAZO[0].n : o.vencimiento === 'Por vencer > 30 días' ? OBS_PLAZO[2].n : OBS_PLAZO[1].n);
const altaCrit = o => ['Crítico', 'Relevante'].includes(o.criticidad);
const diasVencida = o => (obsVencida(o) ? dias(o.compromiso, DATOS.obs_meta.corte) : null);
const obsDimVal = (o, mapa) => (o[obsDim] ?? mapa[o.id_modelo][obsDim]);
const plazoSegs = os => OBS_PLAZO.map(p => ({ ...p, v: cuenta(os, o => obsPlazo(o) === p.n) }));
const totalSegs = f => f.segs.reduce((a, s) => a + s.v, 0);
const obsApiladas = (os, clave, orden) => {
  const vals = orden || [...new Set(os.map(clave))];
  const filas = vals.map(t => ({ t, segs: plazoSegs(os.filter(o => clave(o) === t)) })).filter(totalSegs);
  if (!orden) filas.sort((a, b) => b.segs[0].v - a.segs[0].v || totalSegs(b) - totalSegs(a));

};
function antiguedadObs(venc) {

    .map(([e, v]) => ({ t: e, v, c: 'var(--r)', tip: `${e}\n${v} observaciones · ${pctTxt(v, venc.length)}` })), venc.length);
}
function topModelosObs(venc, mapa) {
  const por = {}; venc.forEach(o => { por[o.id_modelo] = (por[o.id_modelo] || 0) + 1; });
  const top = Object.entries(por).sort((a, b) => b[1] - a[1]).slice(0, 10);
  return barras(top.map(([id, v]) => ({ t: mapa[id].NOMBRE_MODELO, v, c: 'var(--r)', tip: `${id} · ${mapa[id].NOMBRE_MODELO}\n${v} vencidas` })), top.length ? top[0][1] : 0);
}
function tablaObs(os, mapa) {

      <td><span class="badge ${CRIT_CLS[o.criticidad]}">${esc(o.criticidad)}</span></td><td class="text-nowrap">${esc(o.ambito)}</td><td class="text-nowrap">${esc(o.tipo_revision)}</td>

    </tbody></table></div>${verMas('obs-mas', os.length, obsLim)}`;

/* ===================== IMPLEMENTACIÓN ===================== */
const AMBIENTES = [{ n: 'PRODUCTIVO', c: 'var(--g)' }, { n: 'MIXTO', c: 'var(--a)' }, { n: 'NO PRODUCTIVO', c: 'var(--r)' }, { n: 'EN REVISIÓN', c: '#8a93a0' }, { n: 'Sin información', c: 'var(--n)' }];
const AMB_CLS = { 'PRODUCTIVO': 'bg-green-lt', 'MIXTO': 'bg-yellow-lt', 'NO PRODUCTIVO': 'bg-red-lt' };

  despliegue: { t: 'Despliegue', amb: 'AMBIENTE_DESPLIEGUE', rat: 'RATIO_IMPLEMENTACION', plat: 'PLATAFORMA_IMPLEMENTACION' },
  data: { t: 'Data', amb: 'AMBIENTE_DATA', rat: 'RATIO_DATA', plat: 'PLATAFORMA_DATA' }
};
const IMPL_DIMS = [{ k: 'BANCA', t: 'Banca' }, { k: 'TIER_MODELO', t: 'Tier' }, { k: 'MODEL_DEVELOPER', t: 'Model developer' }, { k: 'PROCESO', t: 'Proceso' }];

const pctRatio = v => (v == null ? '-' : `${fmt0(v * 100)}%`);

const noProdSegs = f => f.segs[1].v + f.segs[2].v;

function implPor(ms, campo) {
  const fr = FRENTES_IMPL[implFrente];
  return apiladasAmb([...new Set(ms.map(m => m[campo]))].map(t => ({ t, segs: segsAmbiente(ms.filter(m => m[campo] === t), fr.amb) })).sort((a, b) => noProdSegs(b) - noProdSegs(a) || totalAmb(b) - totalAmb(a)));
}
// Una celda de plataforma puede traer varias separadas por coma: el modelo cuenta en cada una
function plataformas(ms, fr) {
  const por = {};
  ms.forEach(m => new Set(String(m[fr.plat] || '').split(',').map(s => s.trim())).forEach(p => { if (p && p !== 'Sin información') (por[p] ||= []).push(m); }));
  const filas = Object.entries(por).map(([t, de]) => ({ t, segs: segsAmbiente(de, fr.amb) })).sort((a, b) => totalAmb(b) - totalAmb(a)).slice(0, 10);
  return apiladasAmb(filas) + `<div class="text-secondary small mt-2">${cuenta(ms, es(fr.plat, 'Sin información'))} modelos sin información de plataforma no se grafican.</div>`;
}
function ratiosPorDim(ms) {

  const fila = (t, de, cls = '') => `<tr class="${cls}"><td>${esc(t)}</td><td class="text-center">${de.length}</td><td class="text-center">${cuenta(de, noProductivo('AMBIENTE_DESPLIEGUE'))}</td><td class="text-center">${cuenta(de, noProductivo('AMBIENTE_DATA'))}</td>${celda(prom(de, 'RATIO_IMPLEMENTACION'))}${celda(prom(de, 'RATIO_DATA'))}</tr>`;

    ${lista.slice(0, implLim).map(m => `<tr><td style="min-width:260px;white-space:normal"><b>${esc(m.ID_MODELO)}</b><div class="text-secondary small">${esc(m.NOMBRE_MODELO)}</div></td><td class="text-center">${esc(m.TIER_MODELO)}</td><td class="text-nowrap">${esc(m.MODEL_USER)}</td><td class="text-nowrap">${esc(m.PRODUCTO)}</td>
      ${plat(m.PLATAFORMA_IMPLEMENTACION)}<td>${amb(m.AMBIENTE_DESPLIEGUE)}</td><td class="text-center">${pctRatio(m.RATIO_IMPLEMENTACION)}</td>${plat(m.PLATAFORMA_DATA)}<td>${amb(m.AMBIENTE_DATA)}</td><td class="text-center">${pctRatio(m.RATIO_DATA)}</td></tr>`).join('')}
    </tbody></table></div>${verMas('impl-mas', lista.length, implLim)}`;
}
function vistaImplementacion(ms) {
  const el = document.getElementById('v-implementacion');
  if (!ms.length) { el.innerHTML = vacio; return; }
  const R = medidas(ms), sd = R.drv.implementacion;
  const npD = cuenta(ms, noProductivo('AMBIENTE_DESPLIEGUE')), npB = cuenta(ms, noProductivo('AMBIENTE_DATA'));
  const evD = cuenta(ms, conAmbiente('AMBIENTE_DESPLIEGUE')), evB = cuenta(ms, conAmbiente('AMBIENTE_DATA'));
  const evo = evolutivoConteos([['No productivo en despliegue', noProductivo('AMBIENTE_DESPLIEGUE')], ['No productivo en data', noProductivo('AMBIENTE_DATA')]], 'Evolutivo de modelos en ambientes no productivos');
  const composicion = apiladasAmb(Object.values(FRENTES_IMPL).map(fr => ({ t: fr.t, segs: segsAmbiente(ms, fr.amb) })));
  const boton = (k, t) => `<button class="btn btn-sm ${implFrente === k ? 'btn-primary' : 'btn-outline-primary'}" data-frente="${k}">${t}</button>`;
  const frente = `<div class="btn-group toolbar" role="group" aria-label="Frente mostrado">${boton('despliegue', 'Despliegue')}${boton('data', 'Data')}</div>`;
  const lista = ms.filter({ todos: () => true, desp: noProductivo('AMBIENTE_DESPLIEGUE'), data: noProductivo('AMBIENTE_DATA'), info: m => !conAmbiente('AMBIENTE_DESPLIEGUE')(m) || !conAmbiente('AMBIENTE_DATA')(m) }[implFiltro])
    .sort((a, b) => (avgN([a.RATIO_IMPLEMENTACION, a.RATIO_DATA]) ?? 2) - (avgN([b.RATIO_IMPLEMENTACION, b.RATIO_DATA]) ?? 2));
  const selFil = `<div class="d-flex flex-wrap gap-2">${selector('impl-fil', 'Filtrar modelos', IMPL_FILTROS, implFiltro)}<button id="impl-csv" class="btn btn-sm btn-outline-secondary toolbar"><i class="ti ti-file-export me-1"></i>Exportar</button></div>`;
  el.innerHTML = `<div class="row row-cards mb-3">
    ${tile('Score Implementación', sd == null ? '–' : fmt(sd), pill(sd), 'ti-gauge', 'blue')}
    ${tile('No productivo en despliegue', npD, `${pctTxt(npD, evD)} de ${evD} con ambiente`, 'ti-rocket', 'red')}
    ${tile('No productivo en data', npB, `${pctTxt(npB, evB)} de ${evB} con ambiente`, 'ti-database', 'orange')}
    ${tile('Ratio implementación', pctRatio(prom(ms, 'RATIO_IMPLEMENTACION')), 'promedio', 'ti-percentage', 'azure')}
    ${tile('Ratio data', pctRatio(prom(ms, 'RATIO_DATA')), 'promedio', 'ti-percentage', 'cyan')}
  </div><div class="row row-cards mb-3">${bloque('col-12', 'Evolutivo de modelos en ambientes no productivos', 'ti-chart-line', cuerpo(evo), `${notaFechas()} · no productivo incluye MIXTO`)}</div>
  <div class="row row-cards">
    ${bloque('col-lg-4', 'Composición por ambiente', 'ti-stack-2', cuerpo(composicion), `${ms.length} modelos`)}
    ${bloque('col-lg-8', 'Ratios por dimensión', 'ti-table', ratiosPorDim(ms), 'No productivo incluye MIXTO · color según umbrales del score', selector('impl-dim', 'Agrupar por', IMPL_DIMS.map(d => [d.k, d.t]), implDim))}
    ${bloque('col-lg-6', 'Ambientes por Model User', 'ti-users-group', cuerpo(implPor(ms, 'MODEL_USER')), 'Ordenado por no productivo y mixto', frente)}
    ${bloque('col-lg-6', 'Ambientes por Producto', 'ti-package', cuerpo(implPor(ms, 'PRODUCTO')), 'Ordenado por no productivo y mixto', frente)}
    ${bloque('col-lg-6', 'Plataformas de implementación', 'ti-server-2', cuerpo(plataformas(ms, FRENTES_IMPL.despliegue)), 'Top 10 · modelos por ambiente de despliegue')}
    ${bloque('col-lg-6', 'Plataformas de data', 'ti-database', cuerpo(plataformas(ms, FRENTES_IMPL.data)), 'Top 10 · modelos por ambiente de data')}
    ${bloque('col-12', 'Detalle de implementación por modelo', 'ti-list-details', tablaImplementacion(lista), `${lista.length} modelos · ordenado de menor a mayor ratio promedio`, selFil)}
  </div>`;
  el.querySelector('#impl-dim').onchange = e => { implDim = e.target.value; vistaImplementacion(filtrados()); };
  el.querySelector('#impl-fil').onchange = e => { implFiltro = e.target.value; implLim = 50; vistaImplementacion(filtrados()); };
  el.querySelectorAll('[data-frente]').forEach(b => b.onclick = () => { implFrente = b.dataset.frente; vistaImplementacion(filtrados()); });
  const mas = el.querySelector('#impl-mas'); if (mas) mas.onclick = () => { implLim += 50; vistaImplementacion(filtrados()); };
  el.querySelector('#impl-csv').onclick = () => {
    const cols = ['ID_MODELO', 'NOMBRE_MODELO', 'TIER_MODELO', 'MODEL_USER', 'PRODUCTO', 'PLATAFORMA_IMPLEMENTACION', 'AMBIENTE_DESPLIEGUE', 'RATIO_IMPLEMENTACION', 'PLATAFORMA_DATA', 'AMBIENTE_DATA', 'RATIO_DATA'];
    descargar('mrm_implementacion.csv', [cols.join(';'), ...lista.map(m => cols.map(c => csvVal(m[c])).join(';'))].join('\n'));
  };
}

const SECCIONES = [['Reporte', [0]], ['Macro', [0]], ['Seguimiento', [0]], ['Validación', [0, 2]], ['Observaciones', [0, 1]], ['Implementación', [0]]];
function flujoInputs() {
  const flecha = '<div class="flujo-flecha" aria-hidden="true"><i class="ti ti-arrow-right"></i></div>';
  const paso = (n, t, cuerpo) => `<div class="flujo-paso"><div class="flujo-num">Paso ${n} · ${t}</div>${cuerpo}</div>`;
  const inputs = INPUTS.map(i => `<div class="flujo-caja input" style="--input:${i.c}"><b>${i.t}</b>${i.d}<div class="text-secondary small mt-1">Identificador: ${i.id}</div></div>`).join('');
  const origen = i => `<span class="flujo-origen" style="--input:${INPUTS[i].c}"><i></i>${INPUTS[i].t.replace(' Score MRM', '')}</span>`;

  return `<div class="flujo">
    ${paso(1, 'Información', inputs)}${flecha}
    ${paso(2, 'Unión', '<div class="flujo-caja ancha"><b>Se unen por modelo</b>Los tres archivos se relacionan con el ID del modelo. Solo se usan los modelos que están en el input principal.</div>')}${flecha}
    ${paso(3, 'Cálculo', '<div class="flujo-caja ancha"><b>Se calculan indicadores y score</b>Cada indicador recibe un puntaje de 0 a 100 según las reglas definidas en el archivo Indicadores, y con ellos se obtiene el score.</div>')}${flecha}
    ${paso(4, 'Reporte', secciones)}

/* ===================== EXPORTAR ===================== */
function descargar(nombre, txt) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' })); a.download = nombre; a.click();
}
const csvVal = v => /[;"\n]/.test(String(v ?? '')) ? '"' + String(v).replace(/"/g, '""') + '"' : (v ?? '');
function exportar() {
  const dk = CFG.drivers.map(d => d.key);
  const rows = filtrados().map(m => [...META_COLS.map(c => m[c]), ...IND.flatMap(i => [fmt(m.vi[i.key]), fmt(m.pi[i.key])]), ...dk.map(k => fmt(m.ps[k])), fmt(m.global), SEM_TXT[sem(m.global)]].map(csvVal).join(';'));
  descargar('mrm_puntajes.csv', [[...META_COLS, ...IND.flatMap(i => ['valor_' + i.key, 'puntaje_' + i.key]), ...dk.map(k => 'puntaje_' + k), 'puntaje_global', 'semaforo'].join(';'), ...rows].join('\n'));
}

function irA(v) {
  document.querySelectorAll('#tabs .nav-link[data-v]').forEach(x => x.parentElement.classList.toggle('active', x.dataset.v === v));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('active', x.id === 'v-' + v));
  window.scrollTo(0, 0);
}
document.getElementById('tabs').onclick = e => {
  const a = e.target.closest('.nav-link[data-v]'); if (!a) return;
  e.preventDefault(); irA(a.dataset.v);
};
document.getElementById('exportar').onclick = exportar;
// Tooltip compartido por los gráficos: lee data-tip del elemento bajo el cursor o con foco
document.body.insertAdjacentHTML('beforeend', '<div id="tip" hidden></div>');
const tipEl = document.getElementById('tip');
const verTip = e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.hidden = true; return; }
  tipEl.textContent = t.dataset.tip; tipEl.hidden = false;
  const r = t.getBoundingClientRect(), a = tipEl.offsetWidth / 2 + 8, h = tipEl.offsetHeight + 8;
  tipEl.style.left = `${Math.min(innerWidth - a, Math.max(a, r.left + r.width / 2))}px`;
  tipEl.style.top = `${Math.max(h, r.top - 6)}px`;
};
document.addEventListener('mouseover', verTip);
document.addEventListener('focusin', verTip);
