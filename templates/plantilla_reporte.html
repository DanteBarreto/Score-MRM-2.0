<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Score MRM</title>
<!-- Plantilla base: Tabler 1.4 (MIT) sobre Bootstrap 5 · Íconos: Tabler Icons (MIT) -->
<!-- Estilos de Tabler, íconos y fuente Archivo: generar_reporte.py los incrusta desde templates/vendor -->

<style>
/* ============ Mundo visual: pizarra de agencia bancaria ============
   Azul marino institucional en la carcasa, cifras condensadas y tabulares,
   naranja reservado para lo activo (sección, filtro y mes seleccionados). */
:root{
  --marino:#085A93; --marino-2:#0B6DB0; --marino-3:#096AAD; --linea-osc:rgba(255,255,255,.18); --txt-osc:#CFE3F3;
  --naranja:#FF6600; --naranja-osc:#FF8F4D; --naranja-txt:#B04400;
  --fondo:#EDF1F6; --borde:#D3DBE5; --borde-suave:#E4E9F0; --tinta:#14213A; --tinta-2:#4A5870; --sutil:#F5F7FA;
  --tblr-primary:#0B5CA8; --tblr-primary-rgb:11,92,168; --tblr-primary-lt:#E5EEF8; --tblr-link-color:#0B5CA8; --tblr-link-color-rgb:11,92,168;
  --tblr-body-color:#14213A; --tblr-secondary:#4A5870; --tblr-border-color:#D3DBE5; --tblr-border-radius:4px;
  --tblr-font-sans-serif:"Archivo","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Semáforo: texto (AA sobre blanco y sobre su fondo), fondo claro, tono para formas y barras, y tono sobre marino */
  --g:#0D6B47; --g-bg:#DDF2E8; --g-dot:#17945F; --g-osc:#45D094;
  --a:#8A4B00; --a-bg:#FCEFD6; --a-dot:#E08A00; --a-osc:#FFBF47;
  --r:#A8141F; --r-bg:#FBE3E4; --r-dot:#D92332; --r-osc:#FF7A7A;
  --n:#5B6676; --n-bg:#EDF0F4; --n-dot:#AEB7C3; --n-osc:#8FA3BD;
  --track:#E9EEF4; --drv-bg:#F3F6FA;
}
body{background-color:var(--fondo);color:var(--tinta);font-family:var(--tblr-font-sans-serif);font-size:.875rem;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
.cifra,.h1,.h2,td.cell,.tablero td.pts,.tablero td.val{font-variant-numeric:tabular-nums}
.cifra{font-stretch:72%;font-weight:800;letter-spacing:-.01em;line-height:1}
::selection{background:#CFE0EE;color:var(--tinta)}
.form-control::placeholder{color:#6B7890}
:focus-visible{outline:2px solid var(--tblr-primary);outline-offset:2px}
.btn{border-radius:4px;font-weight:600}
.btn-primary{--tblr-btn-bg:var(--marino);--tblr-btn-border-color:var(--marino);--tblr-btn-hover-bg:var(--marino-2);--tblr-btn-hover-border-color:var(--marino-2);--tblr-btn-active-bg:#061B33}
.text-primary{color:var(--marino-3)!important}

/* ---------- Barra lateral ---------- */
.navbar-vertical{background:linear-gradient(180deg,#096AAD 0%,#FF6600 100%)!important;border-right:0;color:#fff}
.navbar-vertical .navbar-brand{padding:1.1rem .75rem .9rem}
.marca{font-stretch:75%;font-weight:900;text-transform:uppercase;font-size:1.6rem;letter-spacing:.01em;line-height:1;color:#fff}
.marca span{color:var(--naranja-osc)}
.navbar-vertical .nav-link,.navbar-vertical .nav-link-icon,.navbar-vertical .navbar-toggler{color:#fff!important}
.side-label{font-size:.75rem;color:#fff;font-weight:700;padding:1rem .75rem .35rem;border-top:1px solid var(--linea-osc);margin-top:.5rem}
.filtros{padding:0 .75rem 1rem}
.filtros .form-label{font-size:.75rem;color:#fff;font-weight:600;margin:.55rem 0 .2rem}
.navbar-vertical .form-select,.navbar-vertical .form-control{background-color:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:#fff;border-radius:4px}
.navbar-vertical .form-select option{color:var(--tinta);background:#fff}
.navbar-vertical .form-control::placeholder{color:rgba(255,255,255,.85)}
.navbar-vertical .input-icon-addon{color:#fff}
.navbar-vertical .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.navbar-vertical .btn:hover{background:rgba(255,255,255,.08)}
.filtros .on{border-color:#fff!important;box-shadow:0 0 0 .15rem rgba(255,255,255,.55)}
#nfil{background:#fff!important;color:var(--marino)!important}
.msel{position:relative}
.msel-btn{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.msel-panel{color-scheme:light;position:absolute;z-index:1050;left:0;right:0;top:calc(100% + 4px);background:#fff;color:var(--tinta);border:1px solid var(--borde);border-radius:4px;box-shadow:0 8px 24px rgba(20,33,58,.22);max-height:260px;overflow:auto;padding:.3rem 0}
.msel-acc{display:flex;justify-content:space-between;padding:.2rem .6rem .35rem;border-bottom:1px solid var(--borde);margin-bottom:.2rem}
.msel-acc button{all:unset;cursor:pointer;font-size:.72rem;font-weight:700;color:var(--marino-3)}
.msel-acc button:hover{text-decoration:underline}
.msel-op{display:flex;align-items:flex-start;gap:.45rem;padding:.3rem .6rem;font-size:.8rem;cursor:pointer;line-height:1.25}
.msel-op:hover{background:var(--fondo)}
.msel-op input{margin-top:.12rem;accent-color:var(--marino-3);flex:none}
#fcount{color:#fff;font-weight:600}
.navbar-vertical .navbar-nav{padding:0 .5rem}
.navbar-vertical .nav-link{border-radius:4px;font-weight:500;padding-top:.45rem;padding-bottom:.45rem}
.navbar-vertical .nav-link:hover{background:rgba(255,255,255,.07)}
.navbar-vertical .nav-link:focus-visible{outline:2px solid var(--naranja-osc);outline-offset:-2px}
.navbar-vertical .nav-item.active .nav-link{background:rgba(255,255,255,.2);color:#fff!important;font-weight:700}
.navbar-vertical .nav-item.active .nav-link-icon{color:var(--naranja-osc)!important}

/* ---------- Cabecera ---------- */
.page-header{margin-top:0;padding-top:1.5rem}
.page-pretitle{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:600;color:var(--tinta-2)}
.page-title{font-size:1.75rem;font-weight:800;font-stretch:85%;letter-spacing:-.015em;line-height:1.1;color:var(--tinta)}

/* ---------- Cuadros: placa blanca plana, esquina corta, filete marino arriba ---------- */
.card{border:1px solid var(--borde);border-top:2px solid var(--marino);border-radius:4px;box-shadow:none}
.card-header{background:#fff;border-bottom:1px solid var(--borde-suave);padding:.85rem 1.1rem;min-height:0}
.card-title{font-size:1.02rem;font-weight:700;letter-spacing:-.008em;color:var(--tinta)}
.card-title i{font-size:1.1rem}
.card-header{flex-wrap:wrap;gap:.6rem 1rem}
.card-header>.card-actions{margin:0 0 0 auto;padding:0;max-width:100%}
.card-actions>.d-flex{justify-content:flex-end;align-items:center}
.card-actions .form-select{max-width:100%;min-width:0}
.card-footer{background:var(--sutil);border-top:1px solid var(--borde-suave)}
.subheader{text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600;color:var(--tinta-2)}
.table thead th{background:var(--sutil);color:var(--tinta-2);font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--borde)}
.table>tbody>tr:hover>*{background-color:#F2F6FB}
.table td{border-color:var(--borde-suave)}
.form-select,.form-control{border-radius:4px}

/* ---------- Pizarra (firma del reporte) ---------- */
.pizarra{background:var(--marino);color:#fff;border-radius:4px;margin-bottom:1rem;display:grid;grid-template-columns:minmax(230px,1.05fr) minmax(0,3fr)}
.pz-global{padding:1.25rem 1.5rem 1.1rem}
.pz-et{font-size:.8rem;color:var(--txt-osc);font-weight:600}
.pz-num{font-size:5.75rem;display:flex;align-items:flex-end;gap:.6rem;margin:.35rem 0 .35rem}
.pz-num small{font-size:.9rem;font-stretch:100%;font-weight:600;color:var(--txt-osc);margin-bottom:.7rem}
.pz-var{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#D4E0EE;flex-wrap:wrap}
.sube{color:var(--g-osc);font-weight:700}.baja{color:var(--r-osc);font-weight:700}.igual{color:var(--txt-osc);font-weight:700}
.pz-spark{display:block;margin-top:.9rem;width:100%;max-width:260px;height:44px;overflow:visible}
.pz-drivers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-left:1px solid var(--linea-osc)}
.pz-drv{all:unset;box-sizing:border-box;padding:1.25rem 1rem 1.1rem;border-right:1px solid var(--linea-osc);display:flex;flex-direction:column;gap:.35rem;cursor:pointer;transition:background .15s}
.pz-drv:last-child{border-right:0}
.pz-drv:hover{background:rgba(255,255,255,.06)}
.pz-drv:focus-visible{outline:2px solid var(--naranja-osc);outline-offset:-2px}
.pz-drv[aria-disabled=true]{cursor:default}.pz-drv[aria-disabled=true]:hover{background:none}
.pz-drv{min-width:0}
.pz-drv .t{font-size:.8rem;color:#D4E0EE;font-weight:600;display:flex;align-items:flex-start;gap:6px;line-height:1.25;min-width:0;hyphens:auto}
.pz-drv .t i{display:none}
.pz-drv .n{font-size:2.6rem;display:flex;align-items:center;gap:.5rem;margin-top:auto}
.pz-drv .d{font-size:.78rem}
.pz-pie{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--linea-osc);background:rgba(0,0,0,.14)}
.pz-pie>div{padding:.75rem 1.5rem;border-right:1px solid var(--linea-osc)}
.pz-pie>div:last-child{border-right:0}
.pz-pie b{display:block;font-size:1.65rem;color:#fff}
.pz-pie span{font-size:.76rem;color:var(--txt-osc)}
.pizarra .dot.verde{background:var(--g-osc)!important}.pizarra .dot.ambar{background:var(--a-osc)!important}
.pizarra .dot.rojo{background:var(--r-osc)!important}.pizarra .dot.na{box-shadow:inset 0 0 0 2px var(--n-osc)}
@media (max-width:1199px){.pizarra{grid-template-columns:1fr}.pz-drivers{border-left:0;border-top:1px solid var(--linea-osc);grid-template-columns:repeat(3,minmax(0,1fr))}.pz-drv:nth-child(3n){border-right:0}.pz-drv:nth-child(-n+3){border-bottom:1px solid var(--linea-osc)}}
@media (max-width:640px){.pz-drivers,.pz-pie{grid-template-columns:repeat(2,minmax(0,1fr))}.pz-num{font-size:4.5rem}.pz-pie>div{padding:.7rem 1rem}}

/* ---------- Tarjetas de conteo ---------- */
.stat .avatar{width:2.5rem;height:2.5rem;font-size:1.25rem;border-radius:4px;background:var(--drv-bg)!important;color:var(--marino-3)!important}
.stat .h2{font-stretch:72%;font-weight:800;letter-spacing:-.01em}
.stat .h2{font-size:2rem;line-height:1}

/* ---------- Gráficos ---------- */
.lineas svg{display:block;width:100%;height:auto}
.lineas text{font-family:inherit;fill:var(--tinta-2);font-size:12px;font-variant-numeric:tabular-nums}
.lineas text.valor{fill:var(--tinta);font-size:15px;font-weight:800;font-stretch:80%}
.lineas text.sel{fill:var(--naranja-txt);font-weight:800}
.lineas .rejilla{stroke:var(--borde-suave);stroke-dasharray:2 4}
.lineas .hit{fill:transparent;outline:none}
.lineas .hit:focus-visible{stroke:var(--tblr-primary);stroke-width:2}
.lineas .cruz{stroke:var(--tinta-2);stroke-width:1;opacity:0}
.lineas .col:hover .cruz,.lineas .col:focus-within .cruz{opacity:.45}
#tip{position:fixed;transform:translate(-50%,-100%);background:var(--marino);color:#fff;border-radius:4px;box-shadow:0 6px 18px rgba(9,106,173,.25);padding:.45rem .65rem;font-size:.78rem;white-space:pre-line;pointer-events:none;z-index:2000;font-variant-numeric:tabular-nums}
#tip::first-line{font-weight:800}
.leg{display:flex;gap:14px;font-size:.76rem;color:var(--tinta-2);flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barras{display:flex;flex-direction:column;gap:.6rem}
.barra{display:grid;grid-template-columns:minmax(90px,38%) 1fr 3.2rem;gap:.7rem;align-items:center;font-size:.82rem}
.barra .et{line-height:1.35}
.barra b{font-variant-numeric:tabular-nums;font-weight:800;font-stretch:80%;font-size:.95rem;text-align:right}
.pista{display:flex;gap:2px;height:10px}
.pista i{display:block;height:100%;min-width:3px;border-radius:1px}
.donas{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem 1.5rem}
.dona{display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:0}
.dona svg{width:150px;height:150px;display:block}
.dona .arco{cursor:default;transition:opacity .15s}
.dona svg:hover .arco{opacity:.55}.dona svg .arco:hover{opacity:1}
.dona .c1{font-size:22px;font-weight:800;font-stretch:75%;fill:var(--tinta);font-variant-numeric:tabular-nums}
.dona .c2{font-size:10px;fill:var(--tinta-2)}
.dona .tit{font-size:.82rem;font-weight:700}
.vbarras{display:flex;align-items:flex-end;gap:.5rem;height:210px;padding-top:1.4rem;border-bottom:1px solid var(--borde)}
.vbarra{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vbarra b{font-size:.85rem;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;margin-bottom:.2rem}
.vbarra i{display:block;width:100%;max-width:46px;border-radius:2px 2px 0 0;min-height:2px}
.vetiq{display:flex;gap:.5rem;margin-top:.4rem}
.vetiq span{flex:1;min-width:0;font-size:.7rem;line-height:1.2;text-align:center;color:var(--tinta-2);overflow-wrap:anywhere}
.grupo-fila{cursor:pointer}
.grupo-fila button{all:unset;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.grupo-fila button:focus-visible{outline:2px solid var(--tblr-primary);outline-offset:2px}
.heat tr.sub td:first-child{padding-left:2.1rem;color:var(--tinta-2)}

/* ---------- Semáforo: círculo en todos los tamaños ---------- */
.sem{display:inline-flex;align-items:center;gap:6px;padding:.18rem .55rem;border-radius:3px;font-size:.72rem;font-weight:700;white-space:nowrap}
.sem::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sem-dot,currentColor)}
.verde{color:var(--g);background:var(--g-bg)}.ambar{color:var(--a);background:var(--a-bg)}.rojo{color:var(--r);background:var(--r-bg)}.na{color:var(--n);background:var(--n-bg)}
.sem.verde{--sem-dot:var(--g-dot)}.sem.ambar{--sem-dot:var(--a-dot)}.sem.rojo{--sem-dot:var(--r-dot)}.sem.na{--sem-dot:var(--n-dot)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;flex:none}
.dot.na{background:transparent!important;box-shadow:inset 0 0 0 2px var(--n-dot)}

/* ---------- Tablero vertical de indicadores ---------- */
.tablero{margin:0}
.tablero td{vertical-align:middle;padding-top:.6rem;padding-bottom:.6rem}
.tablero td:not(.drv){padding-left:1rem!important}
.tablero td.drv{padding-left:1.1rem!important}
.tablero tr.grupo td{border-top:1px solid var(--borde)}
.tablero td.drv{background:var(--drv-bg);width:190px;border-right:1px solid var(--borde-suave)}
.tablero td.drv .nombre{font-weight:700;display:flex;align-items:center;gap:6px}
.tablero td.drv .nombre i{color:var(--marino-3)}
.tablero td.val{text-align:center;font-weight:600;width:170px}
.sim{display:inline-flex;align-items:center;border:1px solid var(--borde);border-radius:4px;background:#fff;overflow:hidden}
.sim-b{all:unset;cursor:pointer;width:26px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--marino-3);font-size:1rem;transition:background .15s}
.sim-b:hover{background:var(--tblr-primary-lt)}
.sim-b:focus-visible{outline:2px solid var(--tblr-primary);outline-offset:-2px}
.sim-campo{display:inline-flex;align-items:center;border-left:1px solid var(--borde);border-right:1px solid var(--borde);padding:0 .3rem}
.sim-in{width:3.6rem;border:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;color:var(--tinta);background:transparent;padding:.25rem 0;-moz-appearance:textfield}
.sim-in:focus{outline:none}
.sim-campo:focus-within{box-shadow:inset 0 0 0 2px var(--tblr-primary)}
.sim-in::-webkit-outer-spin-button,.sim-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sim-campo .u{font-weight:600;color:var(--tinta-2);font-size:.85rem}
.sim-antes{font-size:.72rem;font-weight:600;color:var(--naranja-txt);min-height:0;margin-top:.15rem}
.sim-antes:empty{display:none}
.tablero tr.sim-on td:not(.drv){background:#FFF4EC}
.tablero tr.sim-deriv td:not(.drv){background:#FFFAF5}
.tablero tr.sim-deriv .sim{border-color:#F5B88A;border-style:dashed}
.sim-sub{display:flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;margin-top:.3rem;font-size:.72rem;font-weight:600;color:var(--tinta-2)}
.sim-sub .sim-b{height:24px;width:22px}.sim-sub .sim-in{width:3rem;padding:.1rem 0;font-size:.8rem}
.sim-base{font-size:.72rem;color:var(--tinta-2);margin-top:.15rem}.sim-base:empty{display:none}
.sim-efectos{font-size:.8rem;background:#FFF4EC;border:1px solid #F5C9A6;border-radius:4px;padding:.5rem .75rem;color:var(--tinta)}
.sim-efectos ul{padding-left:1.1rem}.sim-efectos li{margin-top:.15rem}
.tablero tr.sim-on .sim{border-color:var(--naranja)}
.sim-nota{font-size:.8rem;color:var(--tinta-2);background:var(--fondo);border-radius:4px;padding:.45rem .7rem}
.sim-delta{font-size:.85rem;font-weight:700;white-space:nowrap}
.sim-delta .sube{color:var(--g)}.sim-delta .baja{color:var(--r)}.sim-delta .igual{color:var(--tinta-2)}
.card.simulando{border-top-color:var(--naranja)}
.card.simulando #sim-etq{color:var(--naranja-txt)!important}
.tablero td.luz{text-align:center;width:90px}
.ir-sem{all:unset;cursor:pointer;display:inline-flex;padding:6px;border-radius:50%;transition:background .15s}
.ir-sem:hover{background:var(--tblr-primary-lt)}
.ir-sem:focus-visible{outline:2px solid var(--tblr-primary);outline-offset:1px}
.tablero td.pts{text-align:center;font-weight:800;font-stretch:80%;font-size:1.05rem;width:110px}
.tablero tr.no-aplica td:not(.drv){color:var(--n)}
.tablero tr.no-aplica td.pts{font-size:.8rem;font-weight:600;font-stretch:100%}
.score-actual{display:flex;align-items:center;gap:12px}
.score-actual .num{font-size:2.2rem;font-weight:800;font-stretch:72%;line-height:1;font-variant-numeric:tabular-nums}
.leyenda-umbral{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--borde-suave);background:var(--sutil);font-size:.82rem}
.leyenda-umbral div{display:flex;align-items:center;gap:8px}

/* ---------- Mapas de calor ---------- */
.heat thead th{cursor:pointer;user-select:none;white-space:nowrap;vertical-align:middle}
.heat td{white-space:nowrap}
td.cell{font-weight:800;font-stretch:80%;font-size:.92rem;text-align:center;box-shadow:inset 2px 0 0 #fff}
.macro-scroll{max-height:70vh;overflow:auto}
.macro-scroll thead{position:sticky;top:0;z-index:3}
.macro-scroll thead th{background:var(--sutil)}
.macro-scroll thead tr.banda th{cursor:default;border-left:1px solid var(--borde);color:var(--tinta);text-transform:none;letter-spacing:0;font-size:.78rem}
.macro-scroll .fija{position:sticky;left:0;background:#fff;z-index:1;white-space:normal;min-width:240px;max-width:280px}
.macro-scroll thead .fija{z-index:4;background:var(--sutil)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--borde);color:var(--tinta);border-radius:3px;padding:.15rem .3rem .15rem .6rem;font-size:.78rem;margin:0 .35rem .6rem 0}
.chip b{color:var(--marino-3)}
.chip button{border:0;background:none;color:var(--tinta-2);padding:0 .3rem;font-size:1rem;line-height:1}
.view{display:none}.view.active{display:block}
.empty{padding:40px;text-align:center;color:var(--tinta-2)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.obs-fila{cursor:pointer}
.obs-det td{background:var(--drv-bg);white-space:normal}
/* Flujo de inputs */
.flujo-flecha{display:flex;align-items:center;color:var(--tinta-2);font-size:1.4rem}
@media (max-width:991px){.flujo-flecha{justify-content:center;transform:rotate(90deg)}}
/* Tiempo de atención: barra del TTM real con una marca en el TTM de gobierno */
.ttm{display:grid;grid-template-columns:minmax(120px,36%) 1fr 6.5rem;gap:.6rem;align-items:center;font-size:.82rem;margin-bottom:.55rem}
.ttm .et{line-height:1.35}
.ttm .pista{position:relative;display:block;height:12px;background:var(--track);border-radius:2px}
.ttm .pista i{display:block;height:100%;border-radius:2px;min-width:3px}

<script>
/* ===================== DATOS ===================== */
// generar_reporte.py reemplaza esta marca con el contenido del Excel.
const DATOS = /*__DATOS__*/null;

/* ===================== UTILIDADES DE CÁLCULO ===================== */
// Umbrales del semáforo: rojo < rojo, ámbar entre rojo y verde, verde > verde.
// Dependen de los Tier elegidos en el filtro; sin filtro de Tier se usan los generales.
const UMBRAL_BASE = { rojo: 70, verde: 80 };
const UMBRAL_TIER = { I: { rojo: 85, verde: 90 }, II: { rojo: 80, verde: 85 }, III: { rojo: 75, verde: 80 }, IV: { rojo: 60, verde: 75 } };
// Varios Tier: se aplica la primera regla que se cumple, en este orden.
// "exacto": la selección es justo esos Tier; si no, basta con que la selección incluya el Tier.
// Así, con Tier I y II se usa 81-86, y cualquier otra combinación con Tier I (por ejemplo, los cuatro) usa 70-80.
const UMBRAL_MIX = [
  { incluye: ['I', 'II'], exacto: true, rojo: 81, verde: 86 },
  { incluye: ['I'], rojo: 70, verde: 80 },
  { incluye: ['II'], rojo: 69, verde: 79 },
  { incluye: ['III'], rojo: 66, verde: 77 }
];
const tierRomano = t => { const v = String(t ?? '').replace(/tier/i, '').trim().toUpperCase(); return { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' }[v] || v; };
function umbralesTier(sel) {
  const ts = [...new Set((sel || []).map(tierRomano))];
  if (!ts.length) return { ...UMBRAL_BASE, regla: 'Umbrales generales' };
  if (ts.length === 1) return UMBRAL_TIER[ts[0]] ? { ...UMBRAL_TIER[ts[0]], regla: `Tier ${ts[0]}` } : { ...UMBRAL_BASE, regla: 'Umbrales generales' };
  const r = UMBRAL_MIX.find(x => x.incluye.every(t => ts.includes(t)) && (!x.exacto || ts.length === x.incluye.length));
  return r ? { rojo: r.rojo, verde: r.verde, regla: r.exacto ? `Tier ${r.incluye.join(' y ')}` : `Varios Tier · incluye Tier ${r.incluye[0]}` } : { ...UMBRAL_BASE, regla: 'Umbrales generales' };
}
let UMBRALES = umbralesTier([]);
const clamp = v => Math.max(0, Math.min(100, v));
const sem = s => (s == null ? 'na' : s < UMBRALES.rojo ? 'rojo' : s > UMBRALES.verde ? 'verde' : 'ambar');
const SEM_TXT = { verde: 'Verde', ambar: 'Ámbar', rojo: 'Rojo', na: 'No aplica' };
const COLOR = { verde: 'g', ambar: 'a', rojo: 'r', na: 'n' };
const fmt = v => (v == null ? '–' : (Math.round(v * 10) / 10).toLocaleString('es-PE', { maximumFractionDigits: 1 }));
const fmt0 = v => (v == null ? '–' : Math.round(v).toLocaleString('es-PE'));
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Set', 'Oct', 'Nov', 'Dic'];
const mesTxt = f => `${MESES[+f.slice(5, 7) - 1]}-${f.slice(2, 4)}`;
const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const avgN = a => { const v = a.filter(x => x != null); return v.length ? avg(v) : null; };
const sum = (ms, k) => ms.reduce((a, m) => a + (+m[k] || 0), 0);
const cuenta = (ms, f) => ms.filter(f).length;
const es = (k, ...vals) => m => vals.includes(m[k]);
const prom = (ms, k) => avgN(ms.map(m => m[k]));
const ratio = (n, d) => (d ? clamp(100 * (1 - n / d)) : null);   // 1 - n/d en escala 0-100
const NA = { v: null, p: null };                                 // valor "-" y puntuación "No aplica"

/* ===================== MEDIDAS ===================== */
// Cada medida recibe un conjunto de modelos y devuelve { v: valor, p: puntuación }.
// Se evalúa igual sobre el portafolio filtrado o sobre un solo modelo.
const notaProm = k => ms => { const a = prom(ms, k); return a == null ? NA : { v: a * 100, p: a * 100 }; };
// "Saludable" y "Aceptable" son modelos evaluados sin alerta, igual que "Sin alerta"
const SIN_ALERTA = ['Sin alerta', 'Saludable', 'Aceptable'];
const medAlerta = ms => {
  if (!cuenta(ms, es('ESTADO_ALERTA', 'En alerta', ...SIN_ALERTA))) return NA;
  const v = cuenta(ms, es('ESTADO_ALERTA', 'En alerta'));
  return { v, p: ratio(v, ms.length), d: ms.length };
};
const medAmbiente = (amb, rat) => ms => {
  const n = cuenta(ms, es(amb, 'PRODUCTIVO', 'NO PRODUCTIVO', 'MIXTO'));
  if (!n) return NA;
  const r = prom(ms, rat);
  return { v: cuenta(ms, es(amb, 'NO PRODUCTIVO', 'MIXTO')), p: r == null ? null : r * 100, d: n };
};
const medObs = (venc, pend) => ms => ({ v: sum(ms, venc), p: ratio(sum(ms, venc), sum(ms, pend)), d: sum(ms, pend) });

// lp: cómo se puntúa el indicador, explicado para el usuario en la sección Gobierno
const CFG = {
  drivers: [
    { key: 'seguimiento', nombre: 'Seguimiento', icono: 'ti-activity', peso: 1, ind: [
      { key: 'sin_seguimiento', nombre: '# Modelos sin seguimiento', tipo: 'conteo',
        lp: 'Porcentaje de modelos que no figuran sin seguimiento.',
        med: ms => {
          if (!cuenta(ms, es('ESTADO_SEGUIMIENTO', 'Con Seguimiento', 'Sin Seguimiento'))) return NA;
          const v = cuenta(ms, es('ESTADO_SEGUIMIENTO', 'Sin Seguimiento'));
          return { v, p: ratio(v, ms.length), d: ms.length };
        } },
      { key: 'alerta_salud', nombre: '# Modelos con alerta de salud', tipo: 'conteo',
        lp: 'Porcentaje de modelos que no están en alerta.', med: medAlerta },
      { key: 'alerta_excede_tiempo', nombre: '# Modelos con alerta de salud que exceden el tiempo máximo de atención', tipo: 'conteo',
        lp: 'De los modelos en alerta, porcentaje que no excede el tiempo máximo de atención. No aplica si no hay modelos en alerta.',
        med: ms => {
          const a = medAlerta(ms);
          if (a.p == null || a.v === 0 || !cuenta(ms, es('EXCEDE_TTM', 'Excede TTM', 'No excede'))) return NA;

function medidas(ms) {
  const ind = {}, drv = {};
  CFG.drivers.forEach(d => { drv[d.key] = avgN(d.ind.map(i => (ind[i.key] = i.med(ms)).p)); });
  const ds = CFG.drivers.filter(d => drv[d.key] != null);
  const peso = ds.reduce((a, d) => a + d.peso, 0);
  return { ind, drv, global: peso ? ds.reduce((a, d) => a + d.peso * drv[d.key], 0) / peso : null };
}
function preparar(filas) {

    const r = medidas([m]);
    m.ps = r.drv; m.global = r.global; m.pi = {}; m.vi = {};
    IND.forEach(i => { m.pi[i.key] = r.ind[i.key].p; m.vi[i.key] = r.ind[i.key].v; });
    return m;
  });
}

/* Simulación del tablero: el usuario cambia las variables base de los indicadores y se recalculan, en cascada,
   los indicadores que dependen de ellas, sus puntuaciones, los drivers y el score, con las mismas fórmulas del cálculo real.
   Solo cambia lo que se ve en el tablero; los datos y el resto del reporte no se tocan.
   Variables base que edita el usuario (SIM):
   - SIM[k]: valor de cualquier indicador (conteo o nota).
   - SIM[k + ':n']: en observaciones, las pendientes que aún no están vencidas. Total de pendientes = vencidas + a tiempo,
     así que bajar las vencidas equivale a cerrarlas (baja también el total). Para simular que se atendieron a tiempo,
     se bajan las vencidas y se suben las pendientes a tiempo.
   Reglas de dependencia:
   - Modelos en alerta → "exceden el tiempo máximo" y "sin mitigante": su base es el número de modelos en alerta y no pueden
     superarlo. Si bajan las alertas, primero se resuelven las alertas sin exceso y con mitigante; si no alcanza, los hijos se
     recortan al nuevo máximo. Con 0 alertas, ambos pasan a "No aplica" y salen del promedio del driver, como en el cálculo real.
   - Implementación: cada modelo que deja de ser no productivo o mixto pasa a 100% productivo. Primero los no productivos y
     luego los mixtos más avanzados, cada uno con lo que le falta según su ratio real. Si el valor sube, los productivos pasan a
     no productivos.
   - El resto de conteos usa su fórmula real, 1 - valor / base, con la base sin cambios. Las notas usan el valor como puntuación.
   Sin cambios, el resultado es exactamente el cálculo real. */
let SIM = {}, SIM_BASE = null, SIM_MS = [], SIM_AMB = {};
const SIM_HIJOS_ALERTA = ['alerta_excede_tiempo', 'alerta_sin_mitigantes'];
const SIM_OBS = ['obs_venc_validacion', 'obs_venc_reg_aud'];
const SIM_NOMBRE = { alerta_excede_tiempo: 'Alertas que exceden el tiempo máximo de atención', alerta_sin_mitigantes: 'Alertas sin mitigante temporal',
  obs_venc_validacion: 'Observaciones vencidas de validación', obs_venc_reg_aud: 'Observaciones vencidas del regulador local (SBS)' };
const SIM_AMBIENTE = { impl_np_despliegue: ['AMBIENTE_DESPLIEGUE', 'RATIO_IMPLEMENTACION'], impl_np_data: ['AMBIENTE_DATA', 'RATIO_DATA'] };
const simulable = (i, r) => r.v != null && r.p != null && (i.tipo === 'nota' || r.d > 0);
const simPaso = () => 1;
const redondeoVal = (i, v) => (i.tipo === 'nota' ? Math.round(v * 10) / 10 : Math.round(v));
// Ganancias y pérdidas de cada modelo de implementación, en el orden en que se aplican
function ambiente(k) {
  if (SIM_AMB[k]) return SIM_AMB[k];
  const [amb, rat] = SIM_AMBIENTE[k], conRatio = SIM_MS.filter(m => m[rat] != null && m[rat] !== '');
  const r = m => +m[rat];
  const de = (...e) => conRatio.filter(m => e.includes(m[amb]));
  return (SIM_AMB[k] = {
    suma: conRatio.reduce((a, m) => a + r(m), 0), n: conRatio.length,
    gana: [...de('NO PRODUCTIVO').sort((a, b) => r(a) - r(b)), ...de('MIXTO').sort((a, b) => r(b) - r(a))].map(m => 1 - r(m)),
    pierde: de('PRODUCTIVO').sort((a, b) => r(b) - r(a)).map(r)
  });
}
// Estado simulado: valor, base y puntuación de cada indicador, drivers y score
function simular(R) {
  const val = k => (k in SIM ? SIM[k] : R.ind[k].v), ind = {};
  IND.forEach(i => { const r = R.ind[i.key]; ind[i.key] = { v: r.v, d: r.d, p: r.p }; });
  IND.forEach(i => {
    const k = i.key, r = R.ind[k], e = ind[k];
    if (!simulable(i, r)) return;
    if (i.tipo === 'nota') { if (k in SIM) { e.v = SIM[k]; e.p = clamp(SIM[k]); } return; }
    if (SIM_OBS.includes(k)) {
      const v = val(k), n = k + ':n' in SIM ? SIM[k + ':n'] : r.d - r.v;
      Object.assign(e, { v, d: v + n, p: ratio(v, v + n) });
      return;
    }
    if (k in SIM_AMBIENTE) {
      const a = ambiente(k), paso = r.v - val(k);
      if (!paso) return;
      const lista = paso > 0 ? a.gana : a.pierde, total = lista.slice(0, Math.abs(paso)).reduce((x, y) => x + y, 0);
      Object.assign(e, { v: val(k), p: a.n ? clamp(100 * (a.suma + Math.sign(paso) * total) / a.n) : r.p });
      return;
    }
    if (!SIM_HIJOS_ALERTA.includes(k)) { if (k in SIM) Object.assign(e, { v: SIM[k], p: ratio(SIM[k], r.d) }); }
  });
  const A = ind.alerta_salud.v;
  SIM_HIJOS_ALERTA.forEach(k => {
    const i = IND.find(x => x.key === k), r = R.ind[k];
    if (!simulable(i, r) || A == null) return;
    if (A === 0) { Object.assign(ind[k], { v: 0, d: 0, p: null }); return; }
    const v = Math.min(val(k), A);
    Object.assign(ind[k], { v, d: A, p: ratio(v, A) });
  });
  const drv = {};
  CFG.drivers.forEach(d => { drv[d.key] = avgN(d.ind.map(i => ind[i.key].p)); });
  const ds = CFG.drivers.filter(d => drv[d.key] != null), peso = ds.reduce((a, d) => a + d.peso, 0);
  return { ind, drv, global: Object.keys(SIM).length ? (peso ? ds.reduce((a, d) => a + d.peso * drv[d.key], 0) / peso : null) : R.global };
}
// Máximo que admite cada campo según el estado simulado
function simMax(i, r, E, campo) {
  if (i.tipo === 'nota') return 100;
  if (campo === 'n') return Infinity;
  if (SIM_HIJOS_ALERTA.includes(i.key)) return E.ind.alerta_salud.v;
  if (i.key in SIM_AMBIENTE) return r.d;
  if (SIM_OBS.includes(i.key)) return Infinity;
  return Math.max(r.d, r.v);
}
// Indicadores que cambiaron por efecto de otro, para explicárselo al usuario
function efectosSim(R, E) {
  const pts = p => (p == null ? 'No aplica' : `${fmt0(p)} pts`), out = [];
  const A0 = R.ind.alerta_salud.v, A = E.ind.alerta_salud.v;
  SIM_HIJOS_ALERTA.forEach(k => {
    const r = R.ind[k], e = E.ind[k];
    if (r.p == null || A === A0) return;
    const nombre = SIM_NOMBRE[k];
    if (A === 0) out.push(`<b>${nombre}</b> pasa a No aplica porque no quedan modelos en alerta, y sale del promedio de Seguimiento.`);
    else out.push(`<b>${nombre}</b>: ahora se mide sobre ${fmt0(A)} modelos en alerta (antes ${fmt0(A0)})${e.v !== val0(k, R) ? ` y baja de ${fmt0(val0(k, R))} a ${fmt0(e.v)} modelos, porque no puede superar las alertas` : ''} · ${pts(r.p)} → ${pts(e.p)}.`);
  });
  SIM_OBS.forEach(k => {
    const r = R.ind[k], e = E.ind[k];
    if (r.d == null || e.d === r.d) return;
    out.push(`<b>${SIM_NOMBRE[k]}</b>: el total de pendientes pasa de ${fmt0(r.d)} a ${fmt0(e.d)}${e.v < r.v && e.d < r.d ? ' (las vencidas que bajan se cuentan como cerradas)' : ''} · ${pts(r.p)} → ${pts(e.p)}.`);
  });
  return out;
}
const val0 = (k, R) => (k in SIM ? SIM[k] : R.ind[k].v);
const cajaSim = (i, v, campo, etiqueta) => `<div class="sim" data-campo="${campo}"><button type="button" class="sim-b" data-paso="-1" aria-label="Bajar ${etiqueta}">−</button>
    <span class="sim-campo"><input type="number" class="sim-in" value="${v}" min="0" step="${simPaso(i)}" inputmode="decimal" aria-label="${etiqueta} de ${esc(i.nombre)}">${i.tipo === 'nota' && campo === 'v' ? '<span class="u">%</span>' : ''}</span>
    <button type="button" class="sim-b" data-paso="1" aria-label="Subir ${etiqueta}">+</button></div>`;
const celdaValor = (i, r) => {
  if (!simulable(i, r)) return fmtVal(i, r);
  const extra = SIM_OBS.includes(i.key)
    ? `<div class="sim-sub"><span>A tiempo</span>${cajaSim(i, redondeoVal(i, r.d - r.v), 'n', 'Pendientes a tiempo')}</div>`
    : '';
  return `${cajaSim(i, redondeoVal(i, r.v), 'v', 'Valor simulado')}${extra}<div class="sim-base"></div><div class="sim-antes"></div>`;
};

// Tablero vertical: driver | indicador | valor | semáforo | puntuación

      <div class="sim-efectos w-100" id="sim-efectos" aria-live="polite" hidden></div>

let ordenG = { k: 'global', asc: true }, ordenB = { k: 'global', asc: true }, ordenM = { k: 'global', asc: true };

function sparkline(pts) {

  const x = i => 4 + i * (W - 8) / (pts.length - 1), y = v => H - 4 - (v - lo) / (hi - lo || 1) * (H - 8);
  const sel = pts.findIndex(p => p.f === FIL.fecha);
  return `<svg class="pz-spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del score: ${pts.map(p => `${mesTxt(p.f)} ${fmt(p.s)}`).join(', ')}">
    <polyline points="${pts.map((p, i) => `${x(i)},${y(p.s)}`).join(' ')}" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.s)}" r="${i === sel ? 4.5 : 2.5}" fill="${i === sel ? 'var(--naranja)' : '#fff'}"/>`).join('')}</svg>`;
}

    const v = ms.length ? R.drv[d.key] : null, va = A ? A.drv[d.key] : null, vista = VISTA_DRV[d.key];
    const tip = `${d.nombre}\nScore: ${v == null ? 'No aplica' : fmt(v)}${va != null ? `\n${mesTxt(fAnt)}: ${fmt(va)}` : ''}${vista ? '\nClic para abrir la sección' : ''}`;

// Score por FECHA: respeta todos los filtros salvo la propia fecha
function serieEvolutivo() {
  return DATOS.fechas.map(f => {
    const ms = TODOS.filter(m => m.FECHA === f && pasaFiltros(m));
    return { f, n: ms.length, s: ms.length ? medidas(ms).global : null };
  }).filter(p => p.s != null);
}
// Gráfico de líneas por fecha. series: [{ nombre, color, vals }]; op: { ymax, bandas, marcasY, valores, finales, tip }
function lineas(fechas, series, op) {
  const W = op.W || 900, H = op.H || 200, M = { t: 24, r: op.finales ? 170 : 30, b: 28, l: op.fmtV ? 44 : 34 };
  const ymin = op.ymin || 0;
  const y = v => M.t + (op.ymax - v) / (op.ymax - ymin) * (H - M.t - M.b);
  const pad = op.W ? 18 : 50;
  const x = i => (fechas.length < 2 ? (M.l + W - M.r) / 2 : M.l + pad + i * (W - M.l - M.r - 2 * pad) / (fechas.length - 1));
  const banda = ([de, a, c]) => (a <= ymin ? '' : `<rect x="${M.l}" y="${y(a)}" width="${W - M.l - M.r}" height="${y(Math.max(de, ymin)) - y(a)}" fill="var(--${c}-bg)" fill-opacity=".6"/>`);
  const fv = op.fmtV || (v => v);
  const marcaY = v => `<line class="rejilla" x1="${M.l}" x2="${W - M.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${M.l - 6}" y="${y(v) + 4}" text-anchor="end">${fv(v)}</text>`;
  const tramos = s => s.vals.slice(1).map((v, i) => `<line x1="${x(i)}" y1="${y(s.vals[i])}" x2="${x(i + 1)}" y2="${y(v)}" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round"/>`).join('');
  const area = s => `<path d="M${x(0)},${y(ymin)} ${s.vals.map((v, i) => `L${x(i)},${y(v)}`).join(' ')} L${x(s.vals.length - 1)},${y(ymin)}Z" fill="${s.color}" fill-opacity=".08"/>`;
  const puntos = s => s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${fechas[i] === FIL.fecha ? 6 : 4}" fill="${s.color}" stroke="${fechas[i] === FIL.fecha ? 'var(--naranja)' : '#fff'}" stroke-width="${fechas[i] === FIL.fecha ? 3 : 2}"/>
    ${op.valores ? `<text class="valor" x="${x(i)}" y="${y(v) - 12}" text-anchor="middle">${fmt(v)}</text>` : ''}`).join('');
  // Etiquetas al final de cada línea, separadas para que no se pisen
  let previo = -99;
  const finales = !op.finales ? '' : series.map(s => ({ s, v: s.vals[s.vals.length - 1] })).sort((a, b) => b.v - a.v).map(({ s, v }) => {
    previo = Math.max(y(v) + 4, previo + 14);
    return `<text x="${x(fechas.length - 1) + 12}" y="${previo}">${esc(s.nombre)}: ${fv(v)}</text>`;
  }).join('');
  const ancho = fechas.length < 2 ? W - M.l - M.r : (W - M.l - M.r - 2 * pad) / (fechas.length - 1);
  const columnas = fechas.map((f, i) => `<text class="${f === FIL.fecha ? 'sel' : ''}" x="${x(i)}" y="${H - 8}" text-anchor="middle">${mesTxt(f)}</text>
    <g class="col"><line class="cruz" x1="${x(i)}" x2="${x(i)}" y1="${M.t}" y2="${H - M.b}"/><rect class="hit" x="${x(i) - ancho / 2}" y="${M.t}" width="${ancho}" height="${H - M.t - M.b}" tabindex="0" data-tip="${esc(op.tip(i))}" aria-label="${esc(op.tip(i))}"/></g>`).join('');
  return `<div class="lineas"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.titulo)}">
    ${(op.bandas || []).map(banda).join('')}${[...new Set([ymin, ...op.marcasY.filter(v => v >= ymin)])].map(marcaY).join('')}${op.area ? series.map(area).join('') : ''}${series.map(tramos).join('')}${series.map(puntos).join('')}${finales}${columnas}</svg></div>`;
}
function evolutivo() {
  const pts = serieEvolutivo(), fechas = pts.map(p => p.f);
  const ult = pts[pts.length - 1], ant = pts[pts.length - 2];
  const delta = ant ? ult.s - ant.s : null;
  const extra = delta == null ? '' : `<span class="text-secondary small">${delta >= 0 ? '▲' : '▼'} ${fmt(Math.abs(delta))} pts vs ${mesTxt(ant.f)}</span>`;
  const tip = i => {
    const p = pts[i], a = pts[i - 1];
    return `${mesTxt(p.f)}\nScore: ${fmt(p.s)} · ${SEM_TXT[sem(p.s)]}\n${p.n} modelos${a ? `\nVariación: ${p.s >= a.s ? '+' : '−'}${fmt(Math.abs(p.s - a.s))} pts` : ''}`;
  };
  const grafico = lineas(fechas, [{ nombre: 'Score', color: 'var(--marino-3)', vals: pts.map(p => p.s) }], {
    ymax: 100, valores: true, area: true, marcasY: [0, UMBRALES.rojo, UMBRALES.verde, 100], titulo: 'Evolutivo del score por fecha', tip,
    ymin: Math.min(50, Math.floor((Math.min(...pts.map(p => p.s)) - 5) / 10) * 10),
    bandas: [[0, UMBRALES.rojo, 'r'], [UMBRALES.rojo, UMBRALES.verde, 'a'], [UMBRALES.verde, 100, 'g']]
  });
  return `<div class="card mb-3"><div class="card-header"><div><h3 class="card-title d-flex align-items-center gap-2"><i class="ti ti-chart-line text-primary"></i>Evolutivo del score</h3>
      <div class="text-secondary small mt-1">Score por fecha con los filtros aplicados</div></div><div class="card-actions">${extra}</div></div>
    <div class="card-body py-2">${grafico}</div></div>`;
}

  caja.hidden = !ef.length;

function conectarSimulador(el) {
  const fijar = (tr, box, v, normalizar) => {
    const i = IND.find(x => x.key === tr.dataset.k), r = SIM_BASE.ind[i.key], inp = box.querySelector('.sim-in');
    const campo = box.dataset.campo, clave = campo === 'n' ? i.key + ':n' : i.key, base = campo === 'n' ? r.d - r.v : r.v;
    if (v === '' || isNaN(v)) { if (normalizar) delete SIM[clave]; actualizarSimulacion(el, normalizar ? null : inp); return; }
    v = redondeoVal(i, Math.max(0, Math.min(simMax(i, r, simular(SIM_BASE), campo), +v)));
    if (v === redondeoVal(i, base)) delete SIM[clave]; else SIM[clave] = v;
    actualizarSimulacion(el, normalizar ? null : inp);
  };
  el.querySelectorAll('.tablero tr[data-k] .sim').forEach(box => {
    const tr = box.closest('tr'), inp = box.querySelector('.sim-in');
    box.querySelectorAll('.sim-b').forEach(b => b.onclick = () => fijar(tr, box, +inp.value + +b.dataset.paso * +inp.step, true));
    inp.oninput = () => fijar(tr, box, inp.value, false);
    inp.onchange = () => fijar(tr, box, inp.value, true);
  });

// Gráfico circular (dona). segs: [{ n, c, v }]
function dona(segs, titulo, centro = 'modelos') {
  const tot = segs.reduce((a, x) => a + x.v, 0), R = 46, C = 2 * Math.PI * R;

    acc += len; return a;

    <circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="20"/>${arcos}
    <text class="c1" x="60" y="62" text-anchor="middle">${tot.toLocaleString('es-PE')}</text><text class="c2" x="60" y="76" text-anchor="middle">${centro}</text></svg></div>`;

    ${bloque('col-lg-6', 'Ambientes por Model User', 'ti-users-group', cuerpo(implPor(ms, 'MODEL_USER')), 'Ordenado por no productivo y mixto', frente)}
    ${bloque('col-lg-6', 'Ambientes por Producto', 'ti-package', cuerpo(implPor(ms, 'PRODUCTO')), 'Ordenado por no productivo y mixto', frente)}

/* ===================== INVENTARIO: MODELOS INPUT Y MOVIMIENTOS ===================== */
// Del inventario se usan los modelos input y las fechas de uso de los modelos que entran o salen. El estado y los demás datos del modelo salen del input principal.
const INV = porModelo(DATOS.inventario);
let invSel = null, invMapa = 'todos';
const INV_MAPA = [['todos', 'Todos los modelos'], ['con', 'Con modelo input'], ['sin', 'Sin modelo input']];
const insumosDe = id => ((INV[id] || {}).insumos || []).map(String);
const MOV_C = { entra: '#0E9384', sale: '#13406F' };
// Modelos que entraron o salieron del score entre dos meses. Se compara sobre todos los modelos y luego
// se aplican los filtros a la fila de cada modelo, para que un cambio de Tier o proceso no cuente como movimiento.
function movimientos(ant, act) {
  const A = TODOS.filter(m => m.FECHA === ant), B = TODOS.filter(m => m.FECHA === act);
  const ia = new Set(A.map(m => m.ID_MODELO)), ib = new Set(B.map(m => m.ID_MODELO));
  return { entran: B.filter(m => !ia.has(m.ID_MODELO) && pasaFiltros(m)), salen: A.filter(m => !ib.has(m.ID_MODELO) && pasaFiltros(m)) };
}
function graficoMovimientos() {
  const F = DATOS.fechas, pares = F.slice(1).map((f, i) => ({ f, ...movimientos(F[i], f) }));
  const max = Math.max(1, ...pares.flatMap(p => [p.entran.length, p.salen.length]));
  const col = (n, c, tip) => `<i style="height:${n / max * 100}%;background:${c}" data-tip="${esc(tip)}"><b>${n || ''}</b></i>`;
  return `<div class="movs">${pares.map(p => `<div class="mov${p.f === ULTIMA ? ' actual' : ''}"><div class="mov-barras">
      ${col(p.entran.length, MOV_C.entra, `${mesTxt(p.f)}\nEntraron ${p.entran.length} modelos`)}${col(p.salen.length, MOV_C.sale, `${mesTxt(p.f)}\nSalieron ${p.salen.length} modelos`)}</div>
      <span>${esc(mesTxt(p.f))}</span></div>`).join('')}</div>
    <div class="mt-2">${leyendaColores([{ n: 'Entraron', c: MOV_C.entra }, { n: 'Salieron', c: MOV_C.sale }])}</div>`;
}
function tablaMov(lista, tipo) {
  if (!lista.length) return `<div class="empty">Ningún modelo ${tipo === 'entra' ? 'entró' : 'salió'} este mes.</div>`;
  const inv = id => DATOS.inv_mov[id] || {};
  const extra = tipo === 'entra' ? ['Inicio de uso'] : ['Estado en inventario', 'Retiro de uso'];
  return `<div class="table-responsive"><table class="table table-sm table-vcenter card-table"><thead><tr><th>Modelo</th><th class="text-center">Tier</th><th>Proceso</th><th>Model User</th><th class="text-center">${tipo === 'entra' ? 'Score' : 'Último score'}</th>${extra.map(t => `<th>${t}</th>`).join('')}</tr></thead><tbody>
    ${[...lista].sort((a, b) => String(a.TIER_MODELO).localeCompare(String(b.TIER_MODELO)) || String(a.NOMBRE_MODELO).localeCompare(String(b.NOMBRE_MODELO), 'es')).map(m => `<tr><td style="min-width:240px;white-space:normal"><b>${esc(cod(m.ID_MODELO))}</b><div class="text-secondary small">${esc(m.NOMBRE_MODELO)}</div></td>
      <td class="text-center">${esc(m.TIER_MODELO)}</td><td>${esc(m.PROCESO)}</td><td class="text-nowrap">${esc(m.MODEL_USER)}</td><td class="cell" style="${cellStyle(m.global)}">${fmt(m.global)}</td>
      ${tipo === 'entra' ? `<td class="text-nowrap">${fechaCorta(inv(m.ID_MODELO).inicio)}</td>` : `<td>${esc(inv(m.ID_MODELO).estado || '–')}</td><td class="text-nowrap">${fechaCorta(inv(m.ID_MODELO).retiro)}</td>`}</tr>`).join('')}
  </tbody></table></div>`;
}
function bloqueMovimientos() {
  const F = DATOS.fechas;
  if (F.length < 2) return '';
  const ant = F[F.length - 2], { entran, salen } = movimientos(ant, ULTIMA);
  const neto = entran.length - salen.length;
  const cifra = (t, v, c, sub) => `<div class="mov-cifra"><div class="subheader">${t}</div><div class="h1 mb-0" style="color:${c}">${v}</div><div class="text-secondary small">${sub}</div></div>`;
  const resumen = `<div class="mov-resumen">${cifra('Entraron', entran.length, MOV_C.entra, 'nuevos en producción')}${cifra('Salieron', salen.length, MOV_C.sale, 'retirados del score')}
    ${cifra('Variación neta', (neto > 0 ? '+' : '') + neto, 'var(--tinta)', `${mesTxt(ant)} → ${mesTxt(ULTIMA)}`)}</div>`;
  const csv = '<button id="mov-csv" class="btn btn-sm btn-outline-secondary toolbar"><i class="ti ti-file-export me-1"></i>Exportar</button>';
  return `${bloque('col-12', 'Altas y bajas del inventario', 'ti-arrows-exchange', cuerpo(`<div class="row g-4 align-items-center"><div class="col-lg-4">${resumen}</div><div class="col-lg-8">${graficoMovimientos()}</div></div>`), `${mesTxt(ULTIMA)} frente a ${mesTxt(ant)} · cada barra compara un mes con el anterior`)}
    ${bloque('col-12', 'Modelos que entraron y salieron', 'ti-switch-horizontal', `<div class="card-body pb-0"><div class="subheader mb-2" style="color:${MOV_C.entra}">Entraron (${entran.length})</div></div>${tablaMov(entran, 'entra')}
      <div class="card-body pb-0"><div class="subheader mb-2" style="color:${MOV_C.sale}">Salieron (${salen.length})</div></div>${tablaMov(salen, 'sale')}`, 'Inicio y retiro de uso según el archivo de inventario', csv)}`;
}
function exportarMovimientos() {
  const F = DATOS.fechas, { entran, salen } = movimientos(F[F.length - 2], ULTIMA);
  const fila = (m, t) => { const i = DATOS.inv_mov[m.ID_MODELO] || {}; return [t, cod(m.ID_MODELO), m.NOMBRE_MODELO, m.TIER_MODELO, m.PROCESO, m.MODEL_USER, fmt(m.global), i.estado, i.inicio, i.retiro]; };
  descargar('mrm_altas_bajas.csv', [['movimiento', 'id_modelo', 'modelo', 'tier', 'proceso', 'model_user', 'score', 'estado_inventario', 'inicio_uso', 'retiro_uso'].join(';'),
    ...[...entran.map(m => fila(m, 'Entró')), ...salen.map(m => fila(m, 'Salió'))].map(f => f.map(csvVal).join(';'))].join('\n'));
}
function vistaInventario(ms) {
  const el = document.getElementById('v-inventario');
  if (!ms.length) { el.innerHTML = vacio; return; }
  if (!INV) { el.innerHTML = '<div class="card"><div class="card-body empty">No se cargó el archivo Inventario de modelos.</div></div>'; return; }
  if (!esUltima()) { soloUltimaFecha(el); return; }
  const SCORE = Object.fromEntries(MODELOS.map(m => [m.ID_MODELO, m]));   // todos los modelos del mes, sin filtros
  const nombre = id => (SCORE[id] ? SCORE[id].NOMBRE_MODELO : (DATOS.inv_nombres[id] || {}).n || id);
  const colorDe = id => (SCORE[id] ? tono(SCORE[id].global) : 'var(--n-dot)');
  const estado = id => (SCORE[id] ? `Score ${fmt(SCORE[id].global)} · ${SEM_TXT[sem(SCORE[id].global)]}` : `Fuera del score · ${(DATOS.inv_nombres[id] || {}).p || 'sin perímetro'}`);
  const chip = id => `<span class="chip-m" data-tip="${esc(`${cod(id)} · ${nombre(id)}\n${estado(id)}`)}"><i style="background:${colorDe(id)}"></i><span>${esc(cod(id))} · ${esc(nombre(id))}</span></span>`;
  const nodo = (id, cls = '') => `<div class="nodo ${cls}" style="--c:${colorDe(id)}"><b>${esc(cod(id))}</b> · ${esc(nombre(id))}<small>${estado(id)}</small></div>`;
  const con = ms.filter(m => insumosDe(m.ID_MODELO).length);
  const usos = {};   // insumo -> modelos seleccionados que lo usan
  con.forEach(m => insumosDe(m.ID_MODELO).forEach(i => (usos[i] ||= []).push(m.ID_MODELO)));
  const distintos = Object.keys(usos), fuera = distintos.filter(i => !SCORE[i]);
  const consumidores = id => MODELOS.filter(m => insumosDe(m.ID_MODELO).includes(id)).map(m => m.ID_MODELO);
  const leyenda = `<div class="leg"><span><i style="background:var(--g)"></i>Modelo input en verde</span><span><i style="background:var(--a)"></i>en ámbar</span><span><i style="background:var(--r)"></i>en rojo</span><span><i style="background:var(--n)"></i>Fuera del score</span></div>`;

  // Mapa por proceso: cada modelo con sus insumos
  const procesos = [...new Set(ms.map(m => m.PROCESO))].sort((a, b) => a.localeCompare(b, 'es'));
  // Los modelos sin modelo input se listan al final de cada proceso, con fondo gris y una etiqueta;
  // se distingue si el inventario no declara modelos input o si el modelo no figura en el inventario.
  const sinInput = m => (INV[m.ID_MODELO] ? '<span class="sin-input"><i class="ti ti-circle-off"></i>Sin modelo input</span>' : '<span class="sin-input fuera-inv"><i class="ti ti-alert-circle"></i>No figura en el inventario</span>');
  const filaMapa = m => { const ins = insumosDe(m.ID_MODELO), sin = !ins.length;
    return `<tr class="${sin ? 'sin' : ''}"><td style="min-width:260px"><b>${esc(cod(m.ID_MODELO))}</b><div class="text-secondary small">${esc(m.NOMBRE_MODELO)}</div></td><td class="text-center">${esc(m.TIER_MODELO)}</td>
      <td class="cell" style="${cellStyle(m.global)}">${fmt(m.global)}</td><td>${sin ? sinInput(m) : ins.map(chip).join('')}</td></tr>`; };
  const verMapa = m => invMapa === 'todos' || (invMapa === 'con') === insumosDe(m.ID_MODELO).length > 0;
  const procMapa = procesos.filter(p => ms.some(m => m.PROCESO === p && verMapa(m)));
  const mapa = procMapa.length ? `<div class="table-responsive"><table class="table table-sm card-table insumos"><thead><tr><th>Modelo</th><th class="text-center">Tier</th><th class="text-center">Score</th><th>Modelos input que usa</th></tr></thead><tbody>
    ${procMapa.map(p => {
      const de = ms.filter(m => m.PROCESO === p), conP = de.filter(m => insumosDe(m.ID_MODELO).length);
      const orden = [...de].sort((a, b) => insumosDe(b.ID_MODELO).length - insumosDe(a.ID_MODELO).length || String(a.NOMBRE_MODELO).localeCompare(String(b.NOMBRE_MODELO), 'es')).filter(verMapa);
      return `<tr class="proceso"><td colspan="4">${esc(p)} <span class="text-secondary fw-normal">· ${de.length} modelos: ${conP.length} con modelo input y ${de.length - conP.length} sin modelo input</span></td></tr>`
        + orden.map(filaMapa).join('');
    }).join('')}</tbody></table></div><div class="card-body pt-2">${leyenda.replace('</div>', '<span class="sin-input"><i class="ti ti-circle-off"></i>Sin modelo input</span><span class="sin-input fuera-inv"><i class="ti ti-alert-circle"></i>No figura en el inventario</span></div>')}</div>` : '<div class="empty">Ningún modelo cumple el criterio seleccionado.</div>';

  // Explorador: insumos -> modelo -> modelos que lo usan
  const opciones = ms.filter(m => insumosDe(m.ID_MODELO).length || consumidores(m.ID_MODELO).length);
  if (!opciones.some(m => m.ID_MODELO === invSel)) invSel = opciones.length ? [...opciones].sort((a, b) => insumosDe(b.ID_MODELO).length - insumosDe(a.ID_MODELO).length)[0].ID_MODELO : null;
  const flecha = '<div class="flujo-flecha" aria-hidden="true"><i class="ti ti-arrow-right"></i></div>';
  const columna = (t, ids, sin) => `<div class="mapa-col"><div class="subheader">${t} (${ids.length})</div>${ids.length ? ids.map(i => nodo(i)).join('') : `<div class="text-secondary small">${sin}</div>`}</div>`;
  const explorador = invSel ? `<div class="mapa-insumos">${columna('Modelos input', insumosDe(invSel), 'No declara modelos input')}${flecha}
    <div class="mapa-col"><div class="subheader">Modelo · ${esc(SCORE[invSel].PROCESO)}</div>${nodo(invSel, 'centro')}</div>${flecha}
    ${columna('Modelos que lo usan', consumidores(invSel), 'Ningún modelo del score lo usa')}</div>` : '<div class="empty">Sin modelos con relaciones de modelo input.</div>';
  const selModelo = invSel ? `<select id="inv-sel" class="form-select form-select-sm toolbar" style="width:auto;max-width:100%" aria-label="Modelo">${opciones.map(m => `<option value="${esc(m.ID_MODELO)}" ${m.ID_MODELO === invSel ? 'selected' : ''}>${esc(cod(m.ID_MODELO))} · ${esc(m.NOMBRE_MODELO)}</option>`).join('')}</select>` : '';

  const exportar = `<div class="d-flex flex-wrap gap-2">${selector('inv-mapa', 'Mostrar', INV_MAPA, invMapa)}<button id="inv-csv" class="btn btn-sm btn-outline-secondary toolbar"><i class="ti ti-file-export me-1"></i>Exportar</button></div>`;
  el.innerHTML = `<div class="row row-cards mb-3">
    ${tile('Modelos con modelo input', con.length, `de ${ms.length} · ${pctTxt(con.length, ms.length)}`, 'ti-affiliate', 'blue')}
    ${tile('Modelos input distintos', distintos.length, 'usados por los modelos seleccionados', 'ti-stack-2', 'azure')}
    ${tile('Modelos input dentro del score', distintos.length - fuera.length, 'tienen score propio', 'ti-gauge', 'green')}
    ${tile('Modelos input fuera del score', fuera.length, 'módulos o modelos sin score', 'ti-eye-off', 'orange')}
    ${tile('Modelos input en rojo', cuenta(distintos, i => SCORE[i] && sem(SCORE[i].global) === 'rojo'), 'con score menor que ' + UMBRALES.rojo, 'ti-alert-triangle', 'red')}
  </div><div class="row row-cards">
    ${bloqueMovimientos()}
    ${bloque('col-12', 'Explorador de modelos input', 'ti-route', cuerpo(`<div class="mb-3">${selModelo}</div>${explorador}`), 'Elige un modelo para ver qué modelos input usa y qué modelos lo usan a él')}
    ${bloque('col-12', 'Mapa de modelos input por proceso', 'ti-sitemap', mapa, `${con.length} de ${ms.length} modelos con modelo input en ${procesos.length} procesos · el color de cada modelo input es el semáforo de su score; los modelos sin modelo input van al final de cada proceso, en gris`, exportar)}
  </div>`;
  const movCsv = el.querySelector('#mov-csv'); if (movCsv) movCsv.onclick = exportarMovimientos;
  const sel = el.querySelector('#inv-sel'); if (sel) sel.onchange = e => { invSel = e.target.value; vistaInventario(filtrados()); };
  el.querySelector('#inv-mapa').onchange = e => { invMapa = e.target.value; vistaInventario(filtrados()); };
  el.querySelector('#inv-csv').onclick = () => {
    const filas = ms.filter(verMapa).flatMap(m => !insumosDe(m.ID_MODELO).length ? [[m.PROCESO, cod(m.ID_MODELO), m.NOMBRE_MODELO, m.TIER_MODELO, fmt(m.global), '', INV[m.ID_MODELO] ? 'Sin modelo input' : 'No figura en el inventario', '', '']] : insumosDe(m.ID_MODELO).map(i => [m.PROCESO, cod(m.ID_MODELO), m.NOMBRE_MODELO, m.TIER_MODELO, fmt(m.global), cod(i), nombre(i), SCORE[i] ? 'Sí' : 'No', SCORE[i] ? fmt(SCORE[i].global) : '']));
    descargar('mrm_modelos_input.csv', [['proceso', 'id_modelo', 'modelo', 'tier', 'score', 'id_modelo_input', 'modelo_input', 'modelo_input_en_score', 'score_modelo_input'].join(';'), ...filas.map(f => f.map(csvVal).join(';'))].join('\n'));
  };
}

// La nota se asigna a cada modelo por PO usuario y model developer (ver generar_reporte.py)
const GOB = DATOS.gobierno;
function notaGobierno(ms) {
  if (!GOB) return '';
  if (!esUltima()) return notaDetalle('El detalle de la nota de gobierno');
  const grupos = {}; let sin = 0;
  ms.forEach(m => { const i = DATOS.gob_de[m.ID_MODELO]; if (i == null) sin++; else (grupos[i] ||= []).push(m); });
  const filas = Object.entries(grupos).map(([i, de]) => ({ g: GOB[i], n: de.length })).sort((a, b) => a.g.nota - b.g.nota);
  if (!filas.length) return bloque('col-12', 'Nota de gobierno por PO usuario', 'ti-scale', '<div class="empty">Los modelos seleccionados no tienen nota de gobierno.</div>');
  const celda = v => (v == null ? `<td class="cell" style="${cellStyle(null)}">-</td>` : `<td class="cell" style="${cellStyle(v)}">${fmt0(v)}</td>`);
  const tabla = `<div class="table-responsive"><table class="table table-vcenter table-sm card-table"><thead><tr><th>PO usuario</th><th>Model developer</th><th>Model User</th><th class="text-center"># Modelos</th><th class="text-center">Nota</th>
    ${DATOS.gob_componentes.map(c => `<th class="text-center">${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${filas.map(({ g, n }) => `<tr><td class="fw-bold">${esc(g.po)}</td><td>${esc(g.dev)}</td><td>${esc(g.user)}</td><td class="text-center">${n}</td>${celda(g.nota)}${g.comp.map(celda).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  return bloque('col-12', 'Nota de gobierno por PO usuario', 'ti-scale', tabla,
    `La nota es el promedio de los componentes con dato · "-" indica que el componente no aplica${sin ? ` · ${sin} modelos seleccionados no tienen nota` : ''}`);
}
/* Contenido de gobierno: viene de contenido/gobierno_modelos.yaml */
const GC = DATOS.gob_contenido;
let gfSel = null, gfPaso = 0, gfRol = null;
const rolDe = id => (GC.roles || []).find(r => r.id === id) || { nombre: id };
const LINEA_TXT = { 1: '1ª línea', 2: '2ª línea', 3: '3ª línea', 0: 'Instancia de aprobación' };
const porConfirmar = t => esc(t).replace(/\[(Por confirmar|detalle por confirmar)\]/gi, m => `<span class="g-pc">${m.slice(1, -1)}</span>`);

// Flujos didácticos: un selector de flujo, los pasos en línea y el detalle del paso elegido
function flujosGobierno() {

function irA(v) {

  if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v);
  document.querySelectorAll('#tabs .nav-link[data-v]').forEach(x => {
    x.parentElement.classList.toggle('active', x.dataset.v === v);
    x.setAttribute('href', '#' + x.dataset.v);
    if (x.dataset.v === v) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current');
  });
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('active', x.id === 'v-' + v));
  window.scrollTo(0, 0);
}

document.body.insertAdjacentHTML('beforeend', '<div id="tip" hidden></div>');
const tipEl = document.getElementById('tip');
const verTip = e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tipEl.hidden = true; return; }
  tipEl.textContent = t.dataset.tip; tipEl.hidden = false;
  const r = t.getBoundingClientRect(), a = tipEl.offsetWidth / 2 + 8, h = tipEl.offsetHeight + 8;
  tipEl.style.left = `${Math.min(innerWidth - a, Math.max(a, r.left + r.width / 2))}px`;
  tipEl.style.top = `${Math.max(h, r.top - 6)}px`;
};
document.addEventListener('mouseover', verTip);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') tipEl.hidden = true;
  // Encabezados ordenables: Enter o espacio ordenan igual que un clic
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('th[data-k]')) { e.preventDefault(); e.target.click(); }
